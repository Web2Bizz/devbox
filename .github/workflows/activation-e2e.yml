name: Activation E2E (Maestro)

# Deterministic regression coverage for the activation flow (first open ->
# server URL entry -> connect -> send first message),
# including the connect-time-401 negative case tied to the 0%-7-day-retention
# / GitHub issue #76 investigation.
#
# Also runs (non-blocking — see scripts/run-e2e-flows.sh's CORE_FLOWS vs
# NEWER_FLOWS split, and issue #104) newer surfaces merged after the initial
# activation suite: DirectoryBrowserSheet's server-folder picker, the
# directory-less "all sessions across all projects" list (+ the #46/#48
# open-across-project regression), VariantPicker's reasoning-effort chip, and
# DiffView/CodeBlock horizontal scroll. See .maestro/flows/directory-picker.yaml,
# all-sessions.yaml, variant-picker.yaml, diff-scroll.yaml. These never once
# ran to completion in CI (they sat behind the activation flows' stale
# assertions fixed by PR #102) and need their own hardening — tracked in #104.
#
# Runs against tests/fixtures/mock-opencode-server.ts (a small dependency-free
# HTTP+SSE stub matching the REAL client protocol read from src/lib/sdk.ts —
# NOT a live opencode server, NOT a WebSocket), so the suite is fast and fully
# self-contained: no external server, no LLM provider, no network flakiness.
#
# This suite is intentionally self-contained (mock server, no live LLM
# backend): a vision-driven CUA harness needing a live opencode server + an
# external LLM would be exploratory/non-deterministic by design, so it isn't
# suited to tight regression assertions like "a 401 must show a visible error."
#
# activation-positive.yaml does NOT assert on the SSE-streamed reply — see
# the comment at the top of that file (issue #90 mode B / PR #102) for why:
# this Android-emulator + Node-mock + adb-reverse combination reliably
# stalls a long-lived SSE connection after its first chunk regardless of
# client transport, a CI-harness limitation with no evidence it affects real
# devices against a real server, so asserting on it here would be asserting
# on the harness rather than the app.
#
# NOTE: this workflow intentionally has NO `push:` trigger. The pull_request
# check is the only gate for the activation suite. With `push:` present the
# same commit was tested twice — once as pull_request, and then again as `push`
# to dev/main the moment the PR merged — and this job is budgeted at 90 minutes
# of emulator, so that second run was a full duplicate of a suite that had
# already passed on that exact tree. Removing `push:` means a direct push to
# dev/main (i.e. bypassing a PR) will NOT run E2E.
#
# That is deliberate, not a hole: neither branch is protected today, but branch
# protection is the documented way to make the PR check mandatory, and once it
# is enabled every change to dev/main must arrive through a pull_request —
# exactly where this workflow runs. Until then, workflow_dispatch stays the
# manual escape hatch for an on-demand run.

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/mobile/app/**"
      - "apps/mobile/src/**"
      - "apps/mobile/packages/**"
      - "apps/mobile/tests/fixtures/**"
      - "apps/mobile/.maestro/**"
      - "apps/mobile/scripts/**"
      - ".github/workflows/activation-e2e.yml"
  workflow_dispatch: {}

# Monorepo: the Expo project, the Maestro flows, the mock servers and the APK
# all live in apps/mobile, which is its own npm project (not a bun workspace).
defaults:
  run:
    working-directory: apps/mobile

jobs:
  activation-e2e:
    runs-on: ubuntu-latest
    # npm ci + expo prebuild + assembleRelease + emulator pipeline, budgeted at
    # 90 min (emulator-boot-timeout alone is 10 min). Raised from 60 on run
    # 38605417554, where the job was cancelled at the 60-min ceiling (setup
    # alone was 47 min: resolve/transforms 11.5, native libs 15.8, CMake app
    # per-ABI 15.6). The extra headroom absorbs cold-cache variance while the
    # x86_64-only + SDK/build-cache work below attacks the 45-min build step
    # itself; a 90-min ceiling must not be read as a 90-min target.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Add emulator to PATH
        run: echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
            # Gradle's LOCAL BUILD CACHE (org.gradle.caching=true, set in
            # apps/mobile/android/gradle.properties). Already covered by
            # ~/.gradle/caches above — listed explicitly so the dependency is
            # visible here, since this cache is the only thing that makes the
            # "Purge stale generated sources" step below non-destructive:
            # that rm kills app/build/intermediates (where cxx/ lives), and
            # build-cache-1 is what puts those task outputs back.
            ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android SDK components
        # The NDK (~2.5 GB unpacked) and the CMake that AGP downloads are NOT
        # under ~/.gradle/caches, so the Gradle cache above never saved them:
        # every run paid "gradle config + NDK/CMake download" = 3.2 min in step
        # timings. system-images is cached for the same reason. Version numbers
        # are pinned here deliberately (cache key must be a pure expression —
        # GITHUB_ENV writes are not visible to the `env` context):
        #   ndk    27.1.12297006 — ExpoRootProjectPlugin.kt fallback ndkVersion
        #                          (setIfNotExist; not overridden in build.gradle)
        #   cmake  3.22.1         — AGP default; RN/Expo never set
        #                          android.externalNativeBuild.cmake.version
        #                          (android.cmakeVersion is unset in gradle.properties)
        #   image  android-30/google_apis/x86_64 — must match the
        #                          android-emulator-runner `api-level`/`target`/`arch`
        #                          below, or the cached image is never used.
        # Bump the NDK/CMake pin when upgrading either; a stale-key miss only
        # costs a download, so a wrong pin degrades to the old behaviour rather
        # than failing the build.
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/cmake
            /usr/local/lib/android/sdk/system-images
          key: ${{ runner.os }}-android-sdk-ndk-27.1.12297006-cmake-3.22.1-sysimg-30-google_apis-x86_64
          restore-keys: |
            ${{ runner.os }}-android-sdk-ndk-27.1.12297006-cmake-3.22.1-

      - name: Purge stale generated sources
        # The restore-keys prefix fallback can restore a generated autolinking
        # tree from a previous package id (the Gradle cache key/restore-keys
        # below are shared with the former CUA harness), making
        # compileReleaseJavaWithJavac fail against
        # the old package (ai.opencode.mobile vs cc.agentlabs.opencode). Delete
        # generated sources so prebuild + Gradle regenerate them.
        run: rm -rf android/app/build/generated android/build/generated android/app/build/intermediates

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Install dependencies & build APK
        run: |
          # npm ci, not npm install: package-lock.json is committed, so ci is
          # deterministic AND skips the dependency-resolution work install does.
          # --legacy-peer-deps is still required (own npm project, deliberate).
          npm ci --legacy-peer-deps
          npx expo prebuild --platform android --no-install
          # prebuild already generates android/app/debug.keystore; without this
          # keytool aborts with "alias <androiddebugkey> already exists".
          # NOT redundant: buildTypes.release uses `signingConfig
          # signingConfigs.debug` (apps/mobile/android/app/build.gradle), so
          # assembleRelease is signed with exactly this keystore. Removing the
          # rm+keytool pair breaks assembleRelease, not just signing.
          rm -f android/app/debug.keystore
          keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          # Gradle flags below are explained BEFORE the command on purpose: a
          # `#` comment placed between backslash-continued lines is joined into
          # the command by the line continuation and silently swallows every
          # flag after it.
          #
          # -PreactNativeArchitectures=x86_64 — the emulator below is x86_64, so
          # building armeabi-v7a/arm64-v8a/x86 as well triples "CMake app"
          # (15.6 min) + native libs (15.8 min) and triples the adb install cost
          # (94 s) for ABIs no test ever runs. reactNativeArchitectures is the
          # documented override point (android/gradle.properties says so
          # verbatim), and gradle.properties keeps 4 ABIs so mobile.yml (real
          # release builds, Play Store) is unaffected.
          #
          # NO --configuration-cache HERE (removed after run 38629786282, where
          # it FAILED the build): Expo/RN's generated
          # apps/mobile/android/app/build.gradle calls node via
          # `[...].execute(null, rootDir)` FIVE times inside the `react { }`
          # block (lines ~12-20) to resolve entryFile / reactNativeDir /
          # hermesCommand / codegenDir / cliFile. Those are configuration-phase
          # external processes, which the configuration cache reports as 5
          # "Configuration cache problems found in this build" →
          # `external process started 'node ...'`. Gradle 9.3.1 (the wrapper)
          # promotes that to a HARD error: assembleRelease produced a valid APK
          # and then the step still exited 1 — and because the build step failed,
          # both `if: always()` post-cache steps were skipped. The flag also
          # bought nothing measurable (0 "Reusing configuration cache" lines:
          # the cache paths above cover ~/.gradle/caches, ~/.gradle/wrapper and
          # apps/mobile/android/.gradle, but NOT ~/.gradle/configuration-cache,
          # so a fresh runner has no entry to restore and nothing to reuse).
          # DO NOT re-add
          # without first making those five .execute() calls configuration-cache
          # safe (e.g. resolving them in a settings plugin / providers) — that is
          # an Expo/RN-template change, not a CI one.
          #
          # Still kept (they are what actually saves time and are safe):
          #   org.gradle.caching=true  — task-output cache, lives in
          #     gradle.properties, shared with mobile.yml and unaffected by the
          #     above (this is what restores cxx/ after the purge step).
          #   -PreactNativeArchitectures=x86_64 — see above.
          #   caches (~/.gradle, android/.gradle, NDK/CMake/system-images) —
          #     plain file caches, no Gradle configuration semantics involved.
          cd android && ./gradlew assembleRelease \
            -PreactNativeArchitectures=x86_64

      - name: Start mock opencode servers
        run: |
          set -x
          mkdir -p artifacts/screenshots
          # Normal mode on 4096 (positive flow) and --fail-auth on 4097 (negative flow).
          # 4098 is normal mode + --seed-sessions (two pre-populated sessions in two
          # different directories, for all-sessions.yaml). 4099 is a fresh normal-mode
          # instance shared by directory-picker.yaml and variant-picker.yaml (its fake
          # file tree / provider variants / project list don't affect each other).
          # 4100 is normal mode + --seed-diff (one session with a pre-existing wide
          # edit-diff tool call + wide code block, for diff-scroll.yaml / issue #21).
          # All bind 0.0.0.0 so the emulator can reach them via 10.0.2.2.
          nohup node tests/fixtures/mock-opencode-server.ts --port 4096 > /tmp/mock-4096.log 2>&1 &
          nohup node tests/fixtures/mock-opencode-server.ts --port 4097 --fail-auth > /tmp/mock-4097.log 2>&1 &
          nohup node tests/fixtures/mock-opencode-server.ts --port 4098 --seed-sessions > /tmp/mock-4098.log 2>&1 &
          nohup node tests/fixtures/mock-opencode-server.ts --port 4099 > /tmp/mock-4099.log 2>&1 &
          nohup node tests/fixtures/mock-opencode-server.ts --port 4100 --seed-diff > /tmp/mock-4100.log 2>&1 &
          for port in 4096 4097 4098 4099 4100; do
            for i in $(seq 1 30); do
              if curl -sf --connect-timeout 1 -m 3 "http://127.0.0.1:${port}/global/health" > /dev/null 2>&1; then
                echo "mock server on ${port} responded (may be 401, that's expected on 4097)"
                break
              fi
              # 4097 always 401s -> curl -sf treats that as failure, so also accept "connection made"
              if curl -s --connect-timeout 1 -m 3 -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/global/health" 2>/dev/null | grep -qE '^[0-9]+$'; then
                echo "mock server on ${port} is up (got an HTTP response)"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "::error::mock server on port ${port} did not come up in 30s"
                cat "/tmp/mock-${port}.log" || true
                exit 1
              fi
              sleep 1
            done
          done

      - name: Pre-install Android system image (visible logs)
        # android-emulator-runner hides sdkmanager output behind > /dev/null,
        # so a poisoned/empty cached image ("contains no system images") is
        # undebuggable. Pre-install here with visible logs: default rev-4 is
        # abandoned upstream, use the supported google_apis path.
        #
        # The `rm -rf` + unconditional reinstall that used to live here would
        # delete exactly what the "Cache Android SDK components" step restores,
        # making that cache worth nothing — so it is now conditional: a healthy
        # cached image is kept as-is, and only a missing/broken one is refetched.
        run: |
          yes | sdkmanager --licenses
          IMAGE_DIR="$ANDROID_HOME/system-images/android-30/google_apis/x86_64"
          if [ -d "$IMAGE_DIR" ] && [ -f "$IMAGE_DIR/package.xml" ] && [ -n "$(ls -A "$IMAGE_DIR" 2>/dev/null)" ]; then
            echo "system image restored from cache and looks intact — skipping reinstall"
            sdkmanager --list_installed | grep "system-images"
            exit 0
          fi
          echo "system image missing or incomplete — reinstalling"
          sdkmanager --list | grep "system-images;android-30"
          rm -rf "$ANDROID_HOME/system-images/android-30"
          sdkmanager --install "system-images;android-30;google_apis;x86_64"
          sdkmanager --list_installed | grep "system-images"

      - name: Run activation E2E flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          emulator-boot-timeout: 600
          # -no-snapshot removed: it disabled snapshot save AND load, pinning
          # every run to a full cold boot (~75 s). Left to the emulator default
          # so a saved snapshot can be loaded. Caveat, honestly: this job boots
          # ONE emulator per run and the AVD is not cached across runs, so the
          # realistic gain here is ~0 — the real install-time win is the
          # x86_64-only APK (adb install was 94 s).
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          # One script file, not one `sh -c` per line — run-e2e-flows.sh does the
          # adb reverse port-forwarding, runs every flow, and captures logcat on
          # exit. (Running maestro line-by-line here broke `cd` persistence and
          # left no diagnostics.)
          # Monorepo: android-emulator-runner executes `script:` from the
          # workspace root, so cd into apps/mobile — run-e2e-flows.sh derives
          # ROOT from `pwd` and resolves the APK relative to it.
          script: cd apps/mobile && bash scripts/run-e2e-flows.sh

      - name: Mock server logs
        if: always()
        run: |
          echo "--- 4096 (normal) ---"; cat /tmp/mock-4096.log || true
          echo "--- 4097 (fail-auth) ---"; cat /tmp/mock-4097.log || true
          echo "--- 4098 (seed-sessions) ---"; cat /tmp/mock-4098.log || true
          echo "--- 4099 (normal, directory-picker + variant-picker) ---"; cat /tmp/mock-4099.log || true
          echo "--- 4100 (seed-diff) ---"; cat /tmp/mock-4100.log || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: activation-e2e-screenshots-${{ github.run_number }}
          path: apps/mobile/artifacts/screenshots/*.png
          if-no-files-found: warn

      - name: Package maestro debug + logcat
        if: always()
        run: |
          if [ -d artifacts/diag ]; then
            tar -C artifacts -czf artifacts/activation-e2e-debug.tar.gz diag
          fi

      - name: Upload maestro debug + logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: activation-e2e-debug-${{ github.run_number }}
          path: apps/mobile/artifacts/activation-e2e-debug.tar.gz
          if-no-files-found: warn
          # Archiving preserves Maestro's hidden `.maestro` hierarchy and
          # prevents upload-artifact from validating generated directory names
          # such as "consent -> connect", whose `>` character is rejected.
