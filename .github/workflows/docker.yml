name: Docker

# Сборка и публикация Docker образов в self-hosted registry + redeploy всего
# compose-стека в Dokploy одним webhook'ом (job `deploy` в конце файла).
# Redeploy — сценарий `compose` из @web2bizz/scaffold pipelines/publish/docker
# (ветка feat/dokploy-redeploy-scenarios), АДАПТИРОВАН, не скопирован целиком:
# целый workflow шаблона не переносим — он запустил бы вторую публикацию
# параллельно с этим (оба на push в dev, см. предупреждение в README шаблона).
# Отклонения от шаблона и причины:
#   - webhook — ТОЛЬКО secrets.DOKPLOY_COMPOSE_WEBHOOK, а не закоммиченные
#     .env.production/.env.development: репо игнорирует `.env.production`
#     (.gitignore) и принципиально не читает `.env.${NODE_ENV}`-файлы
#     (см. шапку docker-compose.yml) — capability-секрет в git противоречил
#     бы этой политике. Имя переменной сохранено как в шаблоне.
#   - needs-цепочка внутри этого workflow, а не отдельный workflow_run:
#     deploy видит outputs affected-матрицы/opencode-фильтра и пропускается
#     при пустой публикации; workflow_run не имел бы к ним доступа.
# Required configuration:
#   secrets.DOCKER_REGISTRY_PASSWORD ... пароль registry (логин: app)
#   secrets.NPM_TOKEN ................ приватный npm registry (@web2bizz/*)
#   secrets.DOKPLOY_COMPOSE_WEBHOOK .. REQUIRED для redeploy: URL webhook
#     compose-сущности (Dokploy → Compose → Deployments → Webhook), только
#     secret — значений в git нет (документация без значений: README +
#     CI-only блок в .env.example).
# Нейминг — через ./.github/actions/resolve-names: ORG/REPO/SERVICE
# Сервисы ищутся в apps/* и services/* (монорепозиторий).
# NOTE(apps/opencode-server): opencode-server НЕ входит в affected-матрицу
# (у него нет package.json — не Nx-проект, в `nx show projects --affected`
# не появляется, плюс его Dockerfile собирается своим контекстом, а не
# корнем `.`), поэтому собирается ниже отдельным job'ом `opencode` вне
# матрицы (Dockerfile apps/opencode-server/Dockerfile, контекст
# apps/opencode-server, нейминг через resolve-names:
# REGISTRY/OWNER/REPO/opencode). Корневой
# docker-compose.yml при этом тянет образы из registry (`*_IMAGE`,
# дефолт `:dev`); локальный build остался только у `frontend-dev`
# (профиль dev). Публикуемые образы — для Dokploy/prod-деплоев,
# забирающих готовые образы из registry.
# NOTE(bun): адаптация шаблона @web2bizz/scaffold под bun-монорепо —
# setup-bun + `bun install` (NPM_TOKEN через env, см. .npmrc/bunfig.toml),
# `bunx nx` вместо `pnpm exec`; sdk-job шаблона удалён (пакета @web2bizz/id
# в этом репо нет, workspaces = backend+frontend).
# NOTE(nx-docker-target): у проектов нет nx-таргета `docker` (таргеты
# выводятся из scripts в apps/*/package.json — backend/frontend его не
# определяют), поэтому финальный шаг шаблона `nx run <project>:docker`
# заменён прямым docker/build-push-action с Dockerfile
# apps/<project>/Dockerfile и тегами из resolve-names.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.projects.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Discover services
        id: discover
        uses: ./.github/actions/resolve-names
        with:
          registry: docker.registry.web2bizz.team
          discover-services: "true"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install
        env:
          # Private scope @web2bizz → https://npm.registry.web2bizz.team.
          # .npmrc/bunfig.toml содержат плейсхолдер ${NPM_TOKEN}/$NPM_TOKEN —
          # токен только через env, никогда дописыванием в .npmrc.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set SHAs for affected
        uses: nrwl/nx-set-shas@v5

      - name: Compute affected docker projects
        id: projects
        env:
          # discovered уходит в python через env — НЕ подстановкой ${{ }}
          # в текст скрипта: `"` в JSON рвал двойные кавычки bash-строки
          # python3 -c "..." и давал json.loads('[backend,frontend,mobile]').
          DISCOVERED: "${{ steps.discover.outputs.services }}"
        run: |
          DISCOVERED='${{ steps.discover.outputs.services }}'
          echo "Discovered services (apps/*, services/*): $DISCOVERED"
          # opencode-server собирается отдельным job'ом `opencode` (свой
          # build-контекст apps/opencode-server, не корень `.`) — из общей
          # матрицы исключён всегда: иначе ручной запуск (matrix=DISCOVERED)
          # и Nx-fail-safe собрали бы его с неверным контекстом и дважды
          # (дубль job'а `opencode`). В affected-ветке исключение no-op:
          # без package.json это не Nx-проект и в пересечение не попадает.
          DISCOVERED=$(echo "$DISCOVERED" | python3 -c "import json,sys; print(json.dumps([s for s in json.load(sys.stdin) if s != 'opencode-server']))")
          echo "Docker services (opencode-server excluded): $DISCOVERED"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # ручной запуск — все сервисы из discover
            echo "matrix=$DISCOVERED" >> "$GITHUB_OUTPUT"
          else
            # affected через Nx, пересечение affected ∩ discovered;
            # пустой affected ([]) — валиден, matrix-job скипается;
            # fallback к discovered только если Nx упал (fail-safe)
            NX_JSON=$(bunx nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD" --json 2>/dev/null) || NX_JSON=""
            if [ -z "$NX_JSON" ]; then
              # Nx не отработал — fail-safe: собираем всё обнаруженное
              echo "matrix=$DISCOVERED" >> "$GITHUB_OUTPUT"
            else
              AFFECTED=$(echo "$NX_JSON" | python3 -c '
          import json,sys,os
          discovered=json.loads(os.environ["DISCOVERED"])
          affected=json.load(sys.stdin)
          filtered=[p for p in affected if p in discovered]
          print(json.dumps(filtered))
          ')
              echo "matrix=$AFFECTED" >> "$GITHUB_OUTPUT"  # [] — валидно, matrix-job скипается
            fi
          fi
          echo "docker projects: $(grep '^matrix=' "$GITHUB_OUTPUT" | tail -1)"

  docker:
    needs: [affected]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.affected.outputs.matrix) }}
    env:
      REGISTRY: docker.registry.web2bizz.team
      PUSH: true
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Resolve registry names
        id: names
        uses: ./.github/actions/resolve-names
        with:
          registry: ${{ env.REGISTRY }}
          service: ${{ matrix.project }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: app
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.service_image_path }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Guard NEXT_PUBLIC_API_URL repo variable
        if: matrix.project == 'frontend'
        run: |
          test -n "${{ vars.NEXT_PUBLIC_API_URL }}" || { echo "::error::vars.NEXT_PUBLIC_API_URL is not set — set it as a GitHub repo variable (Settings → Variables → Actions → NEXT_PUBLIC_API_URL, e.g. https://api.example.com) so the published frontend image bakes the browser-facing API URL instead of localhost"; exit 1; }

      - name: Build and push ${{ matrix.project }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.project }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* is inlined into the browser bundle at `next build`,
          # so the published frontend image must bake it here — compose now
          # pulls registry images (no local build to inject the arg).
          # Fail-closed: the guard step above errors BEFORE this build when
          # the `NEXT_PUBLIC_API_URL` repo variable is unset (no silent
          # localhost bake). Backend gets NO build-arg — its Dockerfile
          # declares no ARG; the conditional below renders an empty string
          # (= no args) for every non-frontend matrix project.
          build-args: ${{ matrix.project == 'frontend' && format('NEXT_PUBLIC_API_URL={0}', vars.NEXT_PUBLIC_API_URL) || '' }}
          # Private registry auth via BuildKit secret (masked, never --build-arg).
          secrets: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}

  # apps/opencode-server — не Nx-проект (нет package.json) и собирается
  # своим контекстом, поэтому вне affected-матрицы по дизайну: явный job
  # ниже, при push — только если затронуты apps/opencode-server/** или сам
  # workflow; при ручном запуске — всегда. В discovery (apps/*) он появится,
  # но affected-пересечение его отсекает (как mobile) — двойной сборки нет.
  opencode-filter:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check whether opencode needs a build
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # неизвестная база (новая ветка/форс-пуш) — fail-safe: собираем
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" -- apps/opencode-server .github/workflows/docker.yml | grep -q .; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  opencode:
    needs: [opencode-filter]
    if: needs.opencode-filter.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      REGISTRY: docker.registry.web2bizz.team
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve registry names
        id: names
        uses: ./.github/actions/resolve-names
        with:
          registry: ${{ env.REGISTRY }}
          service: opencode

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: app
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.service_image_path }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push opencode image
        uses: docker/build-push-action@v6
        with:
          context: apps/opencode-server
          file: apps/opencode-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Redeploy всего compose-стека в Dokploy одним POST на webhook
  # compose-сущности (сценарий `compose` шаблона — см. шапку файла).
  # Запускается только если что-то реально опубликовано (непустая affected-
  # матрица или opencode-билд) и никто не упал; иначе скипается молча.
  # Ручной workflow_dispatch публикует всё + триггерит redeploy (escape hatch).
  deploy:
    name: Trigger Dokploy compose redeploy
    needs: [affected, docker, opencode-filter, opencode]
    # always(): docker/opencode скипаются при пустой матрице/фильтре —
    # без always() deploy тоже скипался бы и условие не вычислилось бы.
    if: >-
      always() &&
      needs.affected.result == 'success' &&
      needs.opencode-filter.result == 'success' &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped') &&
      (needs.opencode.result == 'success' || needs.opencode.result == 'skipped') &&
      ((needs.affected.outputs.matrix != '[]' && needs.affected.outputs.matrix != '') ||
        needs.opencode-filter.outputs.build == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy compose stack
        run: |
          WEBHOOK="${{ secrets.DOKPLOY_COMPOSE_WEBHOOK }}"
          if [ -z "${WEBHOOK}" ]; then
            echo "::error::secrets.DOKPLOY_COMPOSE_WEBHOOK is not set — create the compose webhook in Dokploy (Compose → Deployments → Webhook) and add it as a GitHub secret (values never go to git, see README + CI-only block in .env.example)"
            exit 1
          fi
          if curl -fsS --retry 3 --retry-delay 5 -X POST "${WEBHOOK}"; then
            echo "Dokploy compose redeploy triggered"
            echo "| compose | triggered |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Dokploy compose webhook failed"
            echo "| compose | failed |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
