name: Mobile CI

# Single conditional pipeline for apps/mobile: Linux checks always, the Android
# native build on every non-PR push, then the GitHub Release / Prerelease jobs.
#
# Monorepo: this workflow only ever builds apps/mobile. Path filters keep it from
# firing on backend/frontend-only changes. Note: GitHub does not evaluate path
# filters for tag pushes, so `tags: ["v*"]` (the release path) still fires.
#
# PATH FILTER vs REQUIRED CHECKS — read before enabling branch protection:
#   main is currently NOT protected (`GET /branches/main/protection` → 404), so
#   path filters are safe today: "Typecheck and unit tests" always reports on a
#   mobile PR. A path-filtered required check never reports on docs-only PRs
#   and would block them forever, so if branch protection is ever turned on
#   for main/dev, EITHER remove the `paths:` blocks below, or drop
#   "Typecheck and unit tests" from the required list. See #143.
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"

# The app is a self-contained npm project under apps/mobile (it must NOT use the
# root bun workspace/lockfile), so every `run:` step executes there.
defaults:
  run:
    working-directory: apps/mobile

# Cancel superseded runs for the same ref (e.g. new push to an open PR).
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Platform-neutral gate: runs on every trigger, including PRs. Name kept as
  # "Typecheck and unit tests" because that is the string referenced by branch
  # protection rules / docs.
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node >= 23.6 runs the TypeScript test files natively (type-stripping),
          # matching the local toolchain. No build step or extra deps required.
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies (deterministic)
        run: npm ci --legacy-peer-deps

      - name: Check release version metadata
        run: npm run check:versions

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  android:
    # Heavy native build runs only on real merges (push to main/dev/tags):
    # an open PR gets the test job above and nothing more.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Setup signing
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* && -n "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Signing: production keystore"
          else
            rm -f android/app/debug.keystore
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Signing: debug keystore (non-release build)"
          fi

      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk

  # Tag v* → GitHub Release (single APK)
  # Google Play is the ONLY store channel for release versions
  # (upload itself runs in publish-play-store.yml on prod tags).
  # F-Droid publish was removed.
  release:
    needs: [android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-release

      - name: Create GitHub Release (APK only)
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
          generate_release_notes: true

  # Push to dev → GitHub Prerelease (APK only, no stores)
  # Dev builds publish only as GitHub prerelease APKs, no stores.
  prerelease:
    needs: [android]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-release

      - name: Create GitHub Prerelease (dev)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: "Dev build #${{ github.run_number }} (${{ github.sha }})"
          prerelease: true
          generate_release_notes: true
          files: app-release.apk