name: Publish to Google Play Store

# DISABLED — external publishing paused. Only GitHub APK prereleases via build.yml
# (dev → GitHub prerelease, tag v* → GitHub release). Re-enable by restoring
# the original `on:` triggers below when main should publish to Play again.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to release to"
        required: false
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: "Release status (draft = uploads without going live/review; completed = submit)"
        required: false
        default: "completed"
        type: choice
        options:
          - completed
          - draft

# Monorepo: manual dispatch only — no push/pull_request paths filter applies.
# The Expo project, app.json, distribution/whatsnew and the AAB are apps/mobile-local.
defaults:
  run:
    working-directory: apps/mobile

# A tag push and a `release: published` for the same version must not race two
# uploads into the same track. Serialize per ref instead of cancelling, because
# cancelling mid-upload can leave a half-created Play release.
concurrency:
  group: publish-play-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: false # disabled — see header
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android build outputs
        uses: actions/cache@v5
        with:
          path: |
            apps/mobile/android/app/build/intermediates
            apps/mobile/android/build
            apps/mobile/android/app/.cxx
          key: ${{ runner.os }}-android-build-${{ hashFiles('apps/mobile/package-lock.json', 'apps/mobile/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-android-build-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Bump android.versionCode in app.json
        # Play Store rejects duplicate versionCodes, so derive a monotonic value
        # from github.run_number + offset. expo prebuild reads this into build.gradle.
        # Offset 100 skips past historical collisions (run 31 collided with a
        # manual upload at versionCode 31). Next run = run_number + 100.
        run: |
          node -e "const f='app.json';const j=require('./'+f);j.expo.android=j.expo.android||{};j.expo.android.versionCode=${{ github.run_number }}+100;require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "versionCode now: $(node -p "require('./app.json').expo.android.versionCode")"

      - name: Purge stale generated sources
        # The Android build cache (restore-keys prefix fallback) can restore a
        # generated autolinking tree from a previous package id. Gradle then
        # reuses ReactNativeApplicationEntryPoint.java referencing the OLD
        # package (ai.opencode.mobile.BuildConfig) and compileReleaseJavaWithJavac
        # fails. Delete generated sources so prebuild + Gradle regenerate them
        # for the current package (cc.agentlabs.opencode).
        run: rm -rf android/app/build/generated android/build/generated android/app/build/intermediates

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build AAB
        working-directory: apps/mobile/android
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Verify the release artifact
        # Sanity-check the shipped AAB before it goes to Play: the Hermes
        # bundle entry must exist and be full-size, and app.config readable.
        run: node scripts/verify-release-bundle.mjs android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-bundle
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab

      - name: Resolve Play track
        id: channel
        # AGE-110: releases used to land on `internal` and stop there — production
        # only moved when a human remembered to run workflow_dispatch. It served
        # versionCode 136 (v0.4.5, 2026-06-22) for EIGHT weeks for that reason,
        # which is why a client-side fix shipped in v0.4.14 could not reach the
        # install base. A release tag is already a deliberate act; treat it as one
        # and publish it to the auto-updating channel. Manual dispatch keeps its
        # inputs so `internal`/`draft` dry runs are still one click away.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRACK="${{ github.event.inputs.track || 'internal' }}"
            STATUS="${{ github.event.inputs.status || 'completed' }}"
          else
            TRACK=production
            STATUS=completed
          fi
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }} -> track=$TRACK status=$STATUS"

      - name: Publish to Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: cc.agentlabs.opencode
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ steps.channel.outputs.track }}
          status: ${{ steps.channel.outputs.status }}
          whatsNewDirectory: apps/mobile/distribution/whatsnew

      - name: Record where it landed
        if: always()
        run: |
          {
            echo "### Play publish"
            echo ""
            echo "- event: \`${{ github.event_name }}\`"
            echo "- track: \`${{ steps.channel.outputs.track }}\`"
            echo "- status: \`${{ steps.channel.outputs.status }}\`"
            echo "- versionCode: \`$(node -p "require('./app.json').expo.android.versionCode" 2>/dev/null || echo unknown)\`"
            echo "- version: \`$(node -p "require('./app.json').expo.version" 2>/dev/null || echo unknown)\`"
          } >> "$GITHUB_STEP_SUMMARY"
