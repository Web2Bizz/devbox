name: Security scan

# Why this exists: the one accurate external report we ever received was
# Postgres credentials committed to public repo history. The finding itself
# was cheap to fix; what was missing was a gate that would have caught it
# before the push. This is that gate.

# gitleaks scans the FULL commit history (fetch-depth: 0), so the filter must be
# repo-wide rather than per-app: a secret could have landed in any app, and
# filtering per app would let an unrelated-app PR skip the very commits the gate
# exists to catch. The paths below cover every tree that can hold a secret
# (all apps, contracts, images, docs) plus this workflow itself and the env
# template. Not a required status check (main is unprotected), so a filtered-out
# PR cannot get stuck waiting on a check that never runs.
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "contracts/**"
      - "images/**"
      - "docs/**"
      - ".github/workflows/security-scan.yml"
      - ".env.example"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "contracts/**"
      - "images/**"
      - "docs/**"
      - ".github/workflows/security-scan.yml"
      - ".env.example"

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so a secret introduced in an earlier commit on the
          # branch is caught, not just the tip diff.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
