appId: cc.agentlabs.opencode
name: Activation - negative path (login-gate error must surface visibly, never silently)
---
# Negative activation flow — locks in that a failed login attempt produces a
# visible, actionable error, never a silent failure.
#
# SCOPE CHANGE (flows adapted to the verified app): the old version of this
# flow drove a connect-time 401 against the --fail-auth mock on port 4097 via
# Quick Connect's the old Quick-Connect address field. NONE of that path exists anymore:
#  - the old Quick-Connect address field / the old Add-Connection button never existed in code; the
#    server URL is hardcoded (src/lib/server-config.ts) and Quick Connect has
#    no address field, so no flow can aim the app at 127.0.0.1:4097;
#  - the only pre-auth custom-server path is LAN discovery
#    (login-lan-find-button -> sweep of the /24 on DEFAULT_LAN_PORTS=[4096]),
#    which cannot discover :4097;
#  - connection/add's manual LAN entry (lan-ip-input/lan-port-input) sits
#    behind the auth gate (unauthenticated deep links bounce to /login), so it
#    is unreachable on a fresh install.
# Hence a connect-time-401 has NO reachable trigger through the real UI
# without a code change (e.g. a test-only server override or a pre-auth route
# to connection/add) — and per instructions code is not touched here. What IS
# reachable is the login gate's own validation error: submitting empty
# credentials fires a native Alert titled "Ошибка" ("Введите логин и пароль")
# before any network call (app/login.tsx handleLogin). This flow locks that
# in: alert title visible, dismissable via OK, still on the login gate after
# dismiss (no fake "connected" state). Hermetic — zero network.
#
# GUARD: this flow deliberately never touches the LAN discovery path. Picking a
# LAN candidate connects AUTOMATICALLY (app/login.tsx handlePickLan ->
# addLanConnection + setActiveConnection, no credentials), so there is NO login
# form after lan-use-N anywhere in the app — the username/password form asserted
# here is the ACCOUNT-mode form on the login gate itself (app/login.tsx
# handleLogin, entryMode="account" on a fresh install). Stays valid as long as
# it stays off the LAN path.
#
# Maestro note (kept from the old flow): a native Android AlertDialog's
# message BODY is not exposed to accessibility-tree text matching the way its
# title is, so only the title ("Ошибка") is asserted, not the body text.

- launchApp:
    clearState: true
- takeScreenshot: negative-S1_login_gate

# Fresh install lands on the login gate (app/login.tsx — the _layout.tsx auth
# gate redirects unauthenticated users to /login).
- assertVisible:
    text: "Вход"
- assertVisible:
    id: "login-mode-account"
- assertVisible:
    id: "login-mode-local"
- assertVisible:
    id: "login-username-input"
- assertVisible:
    id: "login-password-input"
- assertVisible:
    id: "login-button"
- takeScreenshot: negative-S2_empty_credentials

# Submit with empty fields: validation alert must appear (visible error, not
# a silent no-op). Generous but local-only wait — no network involved.
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      text: ".*Ошибка.*"
    timeout: 10000
- assertVisible:
    text: ".*Ошибка.*"
- takeScreenshot: negative-S3_visible_error_alert

# Dismissing must leave us on the login gate, not a fake "connected" screen.
- tapOn: "OK"
- assertVisible:
    id: "login-button"
- assertVisible:
    id: "login-username-input"
- takeScreenshot: negative-S4_still_on_login_after_dismiss
