appId: cc.agentlabs.opencode
name: Activation - positive path (connect -> send message)
---
# Positive activation flow: first launch -> login gate -> LAN discovery finds
# the mock opencode server (tests/fixtures/mock-opencode-server.ts, normal
# mode on port 4096) -> AUTOMATIC connection (no login form on the LAN path)
# -> projects -> new session via the folder browser -> send a message -> assert
# it sends (optimistic echo), WITHOUT waiting for the SSE-streamed reply.
# See "Why no reply assertion" below.
#
# Real-UI notes (flows adapted to the verified app — only testIDs that exist
# in code are used):
# - Fresh install lands on the login gate (app/login.tsx). There is NO
#   the old Add-Connection button and NO the old Quick-Connect address field anywhere in the app: the
#   main server URL is hardcoded (src/lib/server-config.ts) and Quick Connect
#   has no address field. A custom server is reachable pre-auth ONLY as a LAN
#   entry: login "Local server" mode -> "Find server on LAN"
#   (login-lan-find-button) -> LanDiscoveryModal sweep -> "Use" (lan-use-N).
# - The sweep probes the emulator's /24 on DEFAULT_LAN_PORTS ([4096]) with a
#   32-wide worker pool, so the mock answers as 10.0.2.2:4096 (host loopback
#   alias; the mock binds 0.0.0.0). KNOWN RISK: run-e2e-flows.sh notes
#   10.0.2.2 was unreliable headless for its shell probes — if RN fetch to
#   10.0.2.2 fails too, lan-candidate-0 never appears and every connect flow
#   fails here, deterministically, with no app bug involved.
# - Picking a LAN candidate CONNECTS AUTOMATICALLY: app/login.tsx
#   handlePickLan calls addLanConnection + setActiveConnection with no
#   credentials, and _layout.tsx's auth gate then router.replace("/(tabs)").
#   There is NO login form after lan-use-N on this path — do not add one.
# - "Connected" is proven by project-list rendering (app/(tabs)/index.tsx
#   only renders it with an active, non-errored connection). The old
#   the old status-dot indicator id never existed in code. Sessions are created via
#   the New Project tab -> "New Session" sheet -> "Browse Folders" (the index
#   FAB was removed; the old new-session FAB never existed).
#
# Why no reply assertion (issue #90 mode B — full investigation on the issue
# and PR #102): the assistant reply is delivered over the app's SSE
# connection (src/lib/sdk.ts global.events()), and in THIS harness
# specifically (Android emulator + this Node mock server + adb-reverse port
# forwarding) that connection reliably delivers exactly one chunk after
# connecting and then nothing until the connection closes — confirmed across
# four independently-implemented client transports (expo/fetch's
# ReadableStream — the one this app ships with, a hand-rolled
# XMLHttpRequest reader, react-native-sse, and react-native-fetch-api's
# `reactNative: { textStreaming: true }`), and ruled out as an
# adb-reverse/mock-flush problem by a raw-socket probe (a plain BSD-sockets
# client with zero React Native involvement, run via `adb shell` through the
# identical adb-reverse tunnel) that streamed every heartbeat incrementally
# in real time. Padding every frame to ~4KB (ruling out a buffer-size
# threshold) made no difference either. That isolates the stall to React
# Native Android's OkHttp-backed networking layer buffering a long-lived
# streaming response in this specific emulator/mock/adb-reverse combination —
# not a defect in any particular client library, and not something
# reproducible with a real opencode server on a real device/network (issue
# #76's 65 affected users prove real SSE connections stream live agent
# output in production; the bug they hit there was the 401-retry storm, not
# a missing/undelivered reply). Asserting on the reply here would therefore
# be asserting on a CI-harness limitation, not real app behavior — so this
# flow verifies everything reliably observable (connect, session
# creation, message send) and stops short of the SSE round trip. If a real
# fix for the underlying RN-Android streaming limitation ever lands (a native
# SSE module, WebSocket transport, etc.), restore the extendedWaitUntil +
# assertVisible block for "Hello from the mock opencode server" /
# "chat-bubble-assistant" that used to follow chat-send-button here.

- launchApp:
    clearState: true
- takeScreenshot: positive-S1_launch

# Login gate: account/local entry choice + username/password form.
- assertVisible:
    text: "Вход"
- assertVisible:
    id: "login-mode-account"
- assertVisible:
    id: "login-mode-local"
- takeScreenshot: positive-S2_login_gate
- tapOn:
    id: "login-mode-local"
- assertVisible:
    id: "login-lan-find-button"
- tapOn:
    id: "login-lan-find-button"

# LAN sweep finds the mock as 10.0.2.2:4096. Generous timeout: a full /24
# sweep with all-1.5s-timeouts takes ~12s+ even when nothing answers.
- extendedWaitUntil:
    visible:
      id: "lan-scan-modal"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "lan-candidate-0"
    timeout: 120000
- takeScreenshot: positive-S3_lan_found
- tapOn:
    id: "lan-use-0"

# Picking a LAN candidate CONNECTS AUTOMATICALLY — no login form on this path.
# app/login.tsx handlePickLan does addLanConnection + setActiveConnection
# directly (no username/password), and _layout.tsx's auth gate sees a client
# for the active connection and router.replace("/(tabs)"). The old
# login-username-input/login-password-input/login-button block that used to sit
# here asserted a screen that does not exist on the LAN path (the address text
# briefly flashes during the redirect — never assert on it).
#
# project-list only renders with an active, non-errored connection (app/(tabs)/
# index.tsx), so waiting for it IS the connected assertion. 40s margin: the
# connection handshake fetches are individually capped (CONNECTION_TEST_TIMEOUT_MS
# = 12s in src/stores/connections.ts, plus the 30s sdk cap).
- extendedWaitUntil:
    visible:
      id: "project-list"
    timeout: 40000
- takeScreenshot: positive-S4_connected
- takeScreenshot: positive-S5_connected

# New session via the New Project tab (tabPress opens the sheet through the
# global UI store — app/(tabs)/_layout.tsx). Tab labels are i18n
# (nav.newProjectTab); CI emulators run en-US so the en label holds.
- tapOn:
    text: "New Project"
- extendedWaitUntil:
    visible:
      text: ".*New Session.*"
    timeout: 15000
- takeScreenshot: positive-S6_new_session_sheet
- tapOn:
    id: "browse-folders-button"
- extendedWaitUntil:
    visible:
      text: ".*Browse Folders.*"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "directory-row-frontend"
    timeout: 10000
- takeScreenshot: positive-S7_browser_open
# Create in the current project root (/mock/project = mock DEFAULT_DIRECTORY).
- tapOn:
    id: "directory-select-button"
- extendedWaitUntil:
    visible:
      id: "chat-message-input"
    timeout: 15000
- assertVisible:
    text: ".*Mock Session.*"
- takeScreenshot: positive-S8_session_opened

- tapOn:
    id: "chat-message-input"
- inputText: "Hello from the activation e2e test"
- hideKeyboard
- takeScreenshot: positive-S9_message_typed
- tapOn:
    id: "chat-send-button"

# Confirms the optimistic local echo: the app shows the sent message
# immediately (src/stores/sessions.ts), independent of the SSE round trip —
# see the file-level comment above for why this flow stops here instead of
# waiting on the streamed reply. Short wait for render, not a network call.
- extendedWaitUntil:
    visible:
      id: "chat-bubble-user"
    timeout: 10000
- assertVisible:
    id: "chat-bubble-user"
- assertVisible:
    text: ".*Hello from the activation e2e test.*"
- takeScreenshot: positive-S10_message_sent
