appId: cc.agentlabs.opencode
name: All sessions across directories - list + open-across-project (regression #46/#48)
---
# Regression coverage for sessions living in different directories: sessions
# created in two folders must each render as its own project card on the
# projects tab (app/(tabs)/index.tsx groups by (connection, directory)), and
# opening a session that belongs to a directory OTHER than the current one
# must actually open it (src/stores/sessions.ts selectSession threads the
# session's directory+connectionId into clientForDirectory — GitHub issues
# #46/#48), not silently fail or open the wrong session.
#
# SCOPE CHANGE (flows adapted to the verified app): the old version relied on
# --seed-sessions (port 4098) plus session-item-* testIDs that never existed
# in code — sessions are NOT rendered as a flat session list anywhere; the
# projects tab shows per-directory PROJECT CARDS (testIDs carry a generated
# connection UUID, so this flow taps them by their exact path text instead)
# and the project screen (app/project/[directory].tsx) lists that directory's
# sessions as untagged rows. Discovery only probes :4096, so seeds are
# unreachable; instead this flow creates two REAL sessions in two REAL
# directories (backend, frontend) against the normal-mode :4096 mock and then
# exercises the cross-directory open. The mock ENFORCES per-directory scoping
# (GET /session/:id and .../message 404 unless x-opencode-directory matches
# the session's directory), so a #46/#48 regression still fails this flow's
# session-screen assertions with 404s rather than passing silently.
#
# Connect path: login gate LAN discovery (see activation-positive.yaml
# header). Tab labels are i18n; CI emulators run en-US.

- launchApp:
    clearState: true

- assertVisible:
    text: "Вход"
- assertVisible:
    id: "login-mode-local"
- tapOn:
    id: "login-mode-local"
- tapOn:
    id: "login-lan-find-button"
- extendedWaitUntil:
    visible:
      id: "lan-candidate-0"
    timeout: 120000
- tapOn:
    id: "lan-use-0"

# Picking a LAN candidate CONNECTS AUTOMATICALLY (app/login.tsx handlePickLan ->
# addLanConnection + setActiveConnection, no credentials; _layout.tsx auth gate
# then routes to /(tabs)) — there is NO login form on this path. The server
# address text only flashes during that redirect, so it is never asserted on.
# project-list only renders with an active, non-errored connection, so waiting
# for it IS the connected assertion. 40s margin: see activation-positive.yaml —
# the connection handshake fetches are individually capped at 12s/30s.
- extendedWaitUntil:
    visible:
      id: "project-list"
    timeout: 40000
- takeScreenshot: allsessions-S1_connected

# Create session A inside backend (New Project tab -> Browse Folders).
- tapOn:
    text: "New Project"
- extendedWaitUntil:
    visible:
      text: ".*New Session.*"
    timeout: 15000
- tapOn:
    id: "browse-folders-button"
- extendedWaitUntil:
    visible:
      id: "directory-row-backend"
    timeout: 10000
- tapOn:
    id: "directory-row-backend"
- extendedWaitUntil:
    visible:
      text: ".*No subfolders here.*"
    timeout: 10000
- tapOn:
    id: "directory-select-button"
- extendedWaitUntil:
    visible:
      id: "chat-message-input"
    timeout: 15000
- assertVisible:
    text: ".*Mock Session.*"

# Back to the projects tab and create session B inside frontend the same way.
- back
- extendedWaitUntil:
    visible:
      id: "project-list"
    timeout: 15000
- tapOn:
    text: "New Project"
- extendedWaitUntil:
    visible:
      text: ".*New Session.*"
    timeout: 15000
- tapOn:
    id: "browse-folders-button"
- extendedWaitUntil:
    visible:
      id: "directory-row-frontend"
    timeout: 10000
- tapOn:
    id: "directory-row-frontend"
- extendedWaitUntil:
    visible:
      text: ".*No subfolders here.*"
    timeout: 10000
- tapOn:
    id: "directory-select-button"
- extendedWaitUntil:
    visible:
      id: "chat-message-input"
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: "project-list"
    timeout: 15000

# Both directories must render as their own project cards (exact path texts —
# card testIDs embed a generated connection UUID, so text taps are used).
- extendedWaitUntil:
    visible:
      text: "/mock/project/backend"
    timeout: 15000
- assertVisible:
    text: "/mock/project/frontend"
- takeScreenshot: allsessions-S2_both_directories_listed

# Open the session from the OTHER directory (#46/#48 regression): project
# card -> project screen -> session row.
- tapOn:
    text: "/mock/project/backend"
- extendedWaitUntil:
    visible:
      id: "project-header-card"
    timeout: 10000
- assertVisible:
    text: ".*Mock Session.*"
- tapOn:
    text: "Mock Session"
- extendedWaitUntil:
    visible:
      id: "chat-message-input"
    timeout: 15000
- assertVisible:
    text: ".*Mock Session.*"
# Confirms GET /session/:id/message actually resolved (empty state, not stuck
# loading / errored) — i.e. the cross-directory session genuinely opened with
# the right directory header, not just navigated to a dead screen.
- assertVisible:
    text: ".*Start a conversation.*"
- takeScreenshot: allsessions-S3_cross_directory_session_opened
