appId: cc.agentlabs.opencode
name: Demo mode - offline scripted walkthrough (no server, zero-server activation)
---
# Covers the offline demo screen (app/demo.tsx, src/lib/demo-script.ts):
# fully offline, hardcoded, local data rendered through the same chat
# components a real session uses. This flow never needs a mock server for
# the demo itself — but the demo route sits behind the auth gate, so it
# connects first (login gate LAN discovery against the normal-mode :4096
# mock — see activation-positive.yaml header), then opens the demo via deep
# link (the screen has no entry button in the app chrome; the old
# the old Try-Demo button id never existed in code).
#
# Verifies: the demo screen renders a scripted conversation (reasoning ->
# tool call -> diff -> permission prompt) through the real
# MessageBubble/ToolCallCard/DiffView/PermissionPrompt components, the
# permission step responds locally (no network — there is no server to talk
# to), and the closing CTA actually routes to the real connect form
# (app/connection/add.tsx, reachable post-auth), not a fake/dead link.

- launchApp:
    clearState: true

# Login gate -> LAN discovery -> local login (real connect path).
- assertVisible:
    text: "Вход"
- assertVisible:
    id: "login-mode-local"
- tapOn:
    id: "login-mode-local"
- tapOn:
    id: "login-lan-find-button"
- extendedWaitUntil:
    visible:
      id: "lan-candidate-0"
    timeout: 120000
- tapOn:
    id: "lan-use-0"
- extendedWaitUntil:
    visible:
      text: ".*10.0.2.2:4096.*"
    timeout: 10000
- tapOn:
    id: "login-username-input"
- inputText: "e2e-user"
- tapOn:
    id: "login-password-input"
- inputText: "e2e-pass"
- hideKeyboard
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "project-list"
    timeout: 40000
- takeScreenshot: demo-S1_connected

- openLink: opencode://demo
- extendedWaitUntil:
    visible:
      id: "demo-screen"
    timeout: 10000
- assertVisible:
    id: "demo-banner"
- takeScreenshot: demo-S2_demo_screen_opened

# Scripted conversation renders through the real chat components.
# Maestro `text` matches the element's FULL text as a regex, so a phrase
# taken from a longer message must be wrapped in `.*…*` (the user message is
# a full sentence, not the bare phrase). Verified against a CI run where the
# demo screen rendered correctly but a bare-substring assert failed.
- assertVisible:
    id: "chat-bubble-user"
- assertVisible:
    text: ".*login button.*"
- assertVisible:
    id: "chat-bubble-assistant"
- assertVisible:
    text: ".*Thinking.*"
- takeScreenshot: demo-S3_conversation

# Tool call card is collapsed by default (same behavior as a real session) —
# tapping it expands the card, which renders the diff DOWNWARD below the
# header. Because the card is scrolled to near the bottom of the viewport to
# tap it, the expanded diff opens off-screen — so scroll again to bring the
# diff into view before asserting (assertVisible does not auto-scroll).
# Verified from a CI failure screenshot where the demo rendered correctly but
# diff-view-scroll sat below the fold.
- scrollUntilVisible:
    element:
      text: ".*Edit src/components/LoginButton.tsx.*"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: ".*Edit src/components/LoginButton.tsx.*"
- scrollUntilVisible:
    element:
      id: "diff-view-scroll"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "diff-view-scroll"
- takeScreenshot: demo-S4_diff_view

# Permission prompt (approve/permission step) — replying only updates local
# demo state, never a real sessionClient.permission.reply() network call.
- scrollUntilVisible:
    element:
      text: ".*Permission Required.*"
    direction: DOWN
    timeout: 10000
- takeScreenshot: demo-S5_permission_prompt
- tapOn:
    text: "Allow"
# Approving swaps the prompt for a completion message that renders below the
# fold; scroll to it (full sentence begins "Tests passed — …", matched as a
# substring regex).
- scrollUntilVisible:
    element:
      text: ".*Tests passed.*"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: ".*Tests passed.*"
- takeScreenshot: demo-S6_permission_approved

# Closing CTA routes to the REAL connect form, not a dead link.
- scrollUntilVisible:
    element:
      id: "demo-connect-button"
    direction: DOWN
    timeout: 10000
- takeScreenshot: demo-S7_cta
- tapOn:
    id: "demo-connect-button"
- extendedWaitUntil:
    visible:
      id: "connect-submit-button"
    timeout: 10000
- assertVisible:
    id: "connect-password-input"
- takeScreenshot: demo-S8_connect_form_reached
