appId: cc.agentlabs.opencode
name: "DiffView horizontal scroll - wide diff reachable by swipe on the demo screen"
---
# GitHub issue #21 ("QA: verify DiffView + CodeBlock horizontal-scroll
# on-device with real, wide content"):
#   - packages/uikit/src/components/chat/DiffView.tsx renders diff lines
#     inside a horizontal ScrollView (testID diff-view-scroll).
#   - packages/uikit/src/components/markdown/CodeBlock.tsx renders code
#     inside a horizontal ScrollView (testID code-block-scroll).
#
# SCOPE CHANGE (flows adapted to the verified app): the old version opened a
# --seed-diff session (port 4100) via a session-item-* id that never existed
# in code. Seeded content is unreachable through the real UI — discovery only
# probes :4096 and no screen can fabricate tool parts — so that half cannot
# run without a code change. What IS reachable is the offline DEMO screen
# (app/demo.tsx, via opencode://demo once connected): it renders a REAL
# completed `edit` tool call through the same ToolCallCard -> EditDetail ->
# DiffView chain a real session uses, so expanding the card and swiping the
# diff ScrollView left genuinely verifies DiffView horizontal scroll
# on-device. The CodeBlock half stays uncovered (no fenced code block exists
# in reachable demo/seed data) — tracked as a known gap, not asserted here.
#
# Caveat for whoever debugs a flake here: assertVisible on a substring deep
# inside one wide, unwrapped Text node is coarser than it looks — Maestro
# determines visibility per ELEMENT, not per glyph (mobile-dev-inc/maestro
# #1275, #2411). Screenshots are taken at every step so a flake can be
# diagnosed visually, not just from the assertion's pass/fail.
#
# Connect path: login gate LAN discovery against the normal-mode :4096 mock
# (see activation-positive.yaml header). The demo itself is fully offline.

- launchApp:
    clearState: true

- assertVisible:
    text: "Вход"
- assertVisible:
    id: "login-mode-local"
- tapOn:
    id: "login-mode-local"
- tapOn:
    id: "login-lan-find-button"
- extendedWaitUntil:
    visible:
      id: "lan-candidate-0"
    timeout: 120000
- tapOn:
    id: "lan-use-0"

# Picking a LAN candidate CONNECTS AUTOMATICALLY (app/login.tsx handlePickLan ->
# addLanConnection + setActiveConnection, no credentials; _layout.tsx auth gate
# then routes to /(tabs)) — there is NO login form on this path. The server
# address text only flashes during that redirect, so it is never asserted on.
# project-list only renders with an active, non-errored connection, so waiting
# for it IS the connected assertion.

# 40s margin: see activation-positive.yaml — the connection handshake's own
# fetches are individually capped at 12s/30s.
- extendedWaitUntil:
    visible:
      id: "project-list"
    timeout: 40000
- takeScreenshot: diffscroll-S1_connected

# The demo screen has no entry button in the app chrome (it is reachable by
# deep link only) and sits behind the auth gate, so it opens post-connect.
- openLink: opencode://demo
- extendedWaitUntil:
    visible:
      id: "demo-screen"
    timeout: 10000
- assertVisible:
    id: "demo-banner"
- takeScreenshot: diffscroll-S2_demo_opened

# The scripted edit tool call renders collapsed (same as a real session) —
# tapping its title expands the card, which renders the diff (DiffView)
# DOWNWARD below the header. Scroll the card into view first (assertVisible
# does not auto-scroll).
- scrollUntilVisible:
    element:
      text: ".*Edit src/components/LoginButton.tsx.*"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: ".*Edit src/components/LoginButton.tsx.*"
- scrollUntilVisible:
    element:
      id: "diff-view-scroll"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "diff-view-scroll"
- takeScreenshot: diffscroll-S3_diffview_revealed

# Swiping the diff ScrollView left must keep it rendered and reachable (the
# pre-fix behavior truncated wide lines with numberOfLines={1}).
- swipe:
    from:
      id: "diff-view-scroll"
    direction: LEFT
- assertVisible:
    id: "diff-view-scroll"
- takeScreenshot: diffscroll-S4_diffview_swiped
