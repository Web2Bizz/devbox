appId: cc.agentlabs.opencode
name: Directory picker - browse server folders and create a session in one
---
# Regression coverage for DirectoryBrowserSheet
# (packages/uikit/src/components/chat/DirectoryBrowserSheet.tsx): New Session
# sheet -> Browse Folders -> the sheet lists the mock server's fake directory
# tree -> tapping a folder navigates into it -> Up navigation returns to the
# parent -> tapping "Use this folder" creates a session scoped to the chosen
# directory.
#
# Real-UI notes (flows adapted to the verified app): connect goes through the
# login gate's LAN discovery (see activation-positive.yaml header — the old
# the old Add-Connection button/the old Quick-Connect address field/the old status-dot indicator/the old new-session FAB
# ids never existed in code). The mock is the NORMAL-mode instance on port
# 4096 (discovered as 10.0.2.2:4096): its fake filesystem (FAKE_FILE_TREE in
# tests/fixtures/mock-opencode-server.ts) is:
#   /mock/project             -> frontend/ (dir), backend/ (dir), README.md (file)
#   /mock/project/frontend    -> (empty)
#   /mock/project/backend     -> (empty)
# and GET /project (FAKE_SERVER_PROJECTS) additionally lists a "docs-project"
# server-known project, exercised as a secondary assertion below. (Port 4099
# in CI runs an identical normal-mode mock; discovery only probes :4096, so
# this flow targets the :4096 instance.)
#
# Session creation opens via the New Project tab (tabPress opens the sheet
# through the global UI store). Tab labels are i18n; CI emulators run en-US.

- launchApp:
    clearState: true

# Login gate -> LAN discovery -> AUTOMATIC connect (real connect path, no
# login form after picking a LAN candidate).
- assertVisible:
    text: "Вход"
- assertVisible:
    id: "login-mode-local"
- tapOn:
    id: "login-mode-local"
- tapOn:
    id: "login-lan-find-button"
- extendedWaitUntil:
    visible:
      id: "lan-candidate-0"
    timeout: 120000
- tapOn:
    id: "lan-use-0"

# app/login.tsx handlePickLan connects immediately (addLanConnection +
# setActiveConnection, no credentials) and _layout.tsx routes to /(tabs). The
# address text only flashes during that redirect, so it is never asserted on.
# project-list only renders with an active, non-errored connection, so waiting
# for it IS the connected assertion.
# 40s margin: the connection handshake's own fetches are individually capped
# (CONNECTION_TEST_TIMEOUT_MS = 12s in src/stores/connections.ts, plus the
# 30s sdk cap) — the wait must not be shorter than the code path it waits on.
- extendedWaitUntil:
    visible:
      id: "project-list"
    timeout: 40000
- takeScreenshot: dirpicker-S1_connected

# Open the New Session sheet via the New Project tab.
- tapOn:
    text: "New Project"
- extendedWaitUntil:
    visible:
      text: ".*New Session.*"
    timeout: 15000
# GET /project surfaces "docs-project" under "Server Projects" (excludes the
# current project, mock-project) — confirms the project-list endpoint wired up.
# The sheet fetches it async on open, so wait rather than assert immediately.
- extendedWaitUntil:
    visible:
      text: ".*docs-project.*"
    timeout: 10000
- takeScreenshot: dirpicker-S2_new_session_modal

# Open the folder browser.
- tapOn:
    id: "browse-folders-button"
- extendedWaitUntil:
    visible:
      text: ".*Browse Folders.*"
    timeout: 10000
# Diagnostic screenshot before the (previously flaky, see issue #104) wait
# below — if this ever regresses again, compare this frame against
# dirpicker-S2 to see whether the sheet actually opened.
- takeScreenshot: dirpicker-S2b_browser_sheet_opened
- extendedWaitUntil:
    visible:
      id: "directory-row-frontend"
    timeout: 10000
- assertVisible:
    id: "directory-row-backend"
# README.md is a FILE, not a directory — DirectoryBrowserSheet filters entries
# to type === "directory", so it must never appear as a row.
- assertNotVisible:
    text: "README.md"
- takeScreenshot: dirpicker-S3_root_listing

# Navigate into "frontend".
- tapOn:
    id: "directory-row-frontend"
- extendedWaitUntil:
    visible:
      text: ".*No subfolders here.*"
    timeout: 10000
- takeScreenshot: dirpicker-S4_inside_frontend

# Up navigation must return to the root listing.
- tapOn:
    id: "directory-up-button"
- extendedWaitUntil:
    visible:
      id: "directory-row-frontend"
    timeout: 10000
- assertVisible:
    id: "directory-row-backend"
- takeScreenshot: dirpicker-S5_up_navigation_back_to_root

# Navigate into "backend" and select it.
- tapOn:
    id: "directory-row-backend"
- extendedWaitUntil:
    visible:
      text: ".*No subfolders here.*"
    timeout: 10000
- takeScreenshot: dirpicker-S6_inside_backend
- tapOn:
    id: "directory-select-button"

# The app creates a session scoped to /mock/project/backend (mock POST
# /session reads x-opencode-directory) and navigates straight to it — the
# native header shows the mock's session title "Mock Session".
- extendedWaitUntil:
    visible:
      id: "chat-message-input"
    timeout: 15000
- assertVisible:
    text: ".*Mock Session.*"
- takeScreenshot: dirpicker-S7_session_created_in_backend
