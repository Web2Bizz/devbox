appId: cc.agentlabs.opencode
name: Tablet baseline - projects grid 1/2/3 columns
---
# Tablet baseline for the projects grid: FlatList uses numColumns from
# useTablet() (1 col <768, 2 cols >=768, 3 cols >=1024 — src/lib/use-tablet.ts)
# with key={numColumns} + columnWrapperStyle gap, and projectCard has flex: 1
# so cards share the row width. On >=1024 the list content is centered with
# maxWidth (app/(tabs)/index.tsx).
#
# Real-UI notes (flows adapted to the verified app): connect goes through the
# login gate's LAN discovery against the normal-mode :4096 mock (see
# activation-positive.yaml header — the old the old Add-Connection button /
# the old Quick-Connect address field / the old status-dot indicator ids never existed in code). The
# old --seed-sessions assertions ("Default Project Session" cards) are
# dropped: seeds on :4098 are undiscoverable (DEFAULT_LAN_PORTS=[4096]), so
# this baseline captures the grid chrome (list + server/LAN source tabs) on a
# fresh connection instead of seeded cards. Runs on a phone emulator too
# (assertions hold); the 2/3-col baseline PNGs are captured on a tablet AVD
# into docs/qa/baselines/.

- launchApp:
    clearState: true

- assertVisible:
    text: "Вход"
- assertVisible:
    id: "login-mode-account"
- assertVisible:
    id: "login-mode-local"
- assertVisible:
    id: "login-username-input"
- assertVisible:
    id: "login-password-input"
- assertVisible:
    id: "login-button"
- tapOn:
    id: "login-mode-local"
- tapOn:
    id: "login-lan-find-button"
- extendedWaitUntil:
    visible:
      id: "lan-candidate-0"
    timeout: 120000
- tapOn:
    id: "lan-use-0"

# Picking a LAN candidate CONNECTS AUTOMATICALLY (app/login.tsx handlePickLan ->
# addLanConnection + setActiveConnection, no credentials; _layout.tsx auth gate
# then routes to /(tabs)) — there is NO login form on this path. The server
# address text only flashes during that redirect, so it is never asserted on.
# project-list only renders with an active, non-errored connection, so waiting
# for it IS the connected assertion.
# 40s margin: see activation-positive.yaml — the connection handshake's own
# fetches are individually capped at 12s/30s.
- extendedWaitUntil:
    visible:
      id: "project-list"
    timeout: 40000

# Grid chrome: the adaptive list and the server/LAN source tabs above the tab
# bar (fresh connection — no cards yet, the empty state renders inside the
# list).
- assertVisible:
    id: "projects-source-tabs"
- assertVisible:
    id: "projects-tab-server"
- assertVisible:
    id: "projects-tab-lan"
- takeScreenshot: tablet-projects-S1_grid
