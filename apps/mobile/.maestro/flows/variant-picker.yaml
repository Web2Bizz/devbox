appId: cc.agentlabs.opencode
name: Variant picker - reasoning-effort select renders, selects, and still sends
---
# Regression coverage for the reasoning-effort picker
# (packages/uikit/src/components/chat/AiSettingsModal.tsx): the effort Select
# only renders when the selected model's provider entry carries `variants`
# (GET /provider), selecting an option updates the Select value, and sending
# a message afterwards still works end-to-end.
#
# Real-UI notes (flows adapted to the verified app — the old model-chip /
# variant-chip / variant-option-* ids never existed in code):
# - The picker lives in the AI settings bottom sheet (session screen
#   ai-settings-button). Model selection goes through the model PickerSheet:
#   option testIDs are `model-select-option-<providerID>/<modelID>` (slash is
#   part of the real id — MODEL_ID_SEP in AiSettingsModal.tsx), so the mock's
#   model is `model-select-option-mock/mock-model`.
# - Effort is an INLINE Select (testID effort-select) with options
#   effort-select-option-auto/low/medium/high (Select.tsx). Tapping the
#   effort-select box expands it; tapping an option collapses it and shows
#   the label ("High") as the Select value.
# - A brand-new session has NO explicit model selection:
#   src/lib/model-selection.ts chooseModelSelection() deliberately returns
#   null until the user picks one, so the effort Select does NOT render on
#   session open. This flow explicitly picks the mock provider's model first.
# - Connect path: login gate LAN discovery against the normal-mode :4096
#   mock (see activation-positive.yaml header); GET /provider there carries
#   low/medium/high variants. Session creation via the New Project tab.
#
# This flow does NOT assert on the SSE-streamed assistant reply after
# sending — see activation-positive.yaml's file-level comment for why
# (issue #90 mode B: a CI-harness-specific SSE limitation, not an app bug).

- launchApp:
    clearState: true

- assertVisible:
    text: "Вход"
- assertVisible:
    id: "login-mode-local"
- tapOn:
    id: "login-mode-local"
- tapOn:
    id: "login-lan-find-button"
- extendedWaitUntil:
    visible:
      id: "lan-candidate-0"
    timeout: 120000
- tapOn:
    id: "lan-use-0"
- extendedWaitUntil:
    visible:
      text: ".*10.0.2.2:4096.*"
    timeout: 10000
- tapOn:
    id: "login-username-input"
- inputText: "e2e-user"
- tapOn:
    id: "login-password-input"
- inputText: "e2e-pass"
- hideKeyboard
- tapOn:
    id: "login-button"

# 40s margin: see activation-positive.yaml — the login handshake's own
# fetches are individually capped at 12s/30s.
- extendedWaitUntil:
    visible:
      id: "project-list"
    timeout: 40000
- takeScreenshot: variant-S1_connected

# Create a quick session in the current project root.
- tapOn:
    text: "New Project"
- extendedWaitUntil:
    visible:
      text: ".*New Session.*"
    timeout: 15000
- tapOn:
    id: "browse-folders-button"
- extendedWaitUntil:
    visible:
      id: "directory-row-frontend"
    timeout: 10000
- tapOn:
    id: "directory-select-button"
- extendedWaitUntil:
    visible:
      id: "chat-message-input"
    timeout: 15000

# Explicitly pick the mock provider's model — a fresh session has no model
# selection yet (see comment above), so the effort Select has nothing to key
# off of until this happens. The catalog (GET /provider) loads async after
# connect, so wait for the option rather than asserting immediately.
- tapOn:
    id: "ai-settings-button"
- extendedWaitUntil:
    visible:
      id: "model-select"
    timeout: 10000
- takeScreenshot: variant-S2_ai_settings_open
- tapOn:
    id: "model-select"
- extendedWaitUntil:
    visible:
      id: "model-select-option-mock/mock-model"
    timeout: 15000
- tapOn:
    id: "model-select-option-mock/mock-model"

# Picking a model closes the sheet (AiSettingsModal handleSelectModel), so
# reopen it: the effort Select now renders (mock model carries variants).
- tapOn:
    id: "ai-settings-button"
- extendedWaitUntil:
    visible:
      id: "effort-select"
    timeout: 10000
- takeScreenshot: variant-S3_effort_default
- tapOn:
    id: "effort-select"
- extendedWaitUntil:
    visible:
      id: "effort-select-option-high"
    timeout: 10000
- assertVisible:
    id: "effort-select-option-low"
- assertVisible:
    id: "effort-select-option-medium"
- takeScreenshot: variant-S4_picker_options

- tapOn:
    id: "effort-select-option-high"
# Option tap collapses the Select and the box value reflects the selection.
- assertVisible:
    text: ".*High.*"
- takeScreenshot: variant-S5_effort_shows_high

# Sending a message must still work with an effort selected (regression: the
# picker must not break the send path). Like activation-positive.yaml, this
# stops at the optimistic local echo instead of waiting on the SSE-streamed
# assistant reply (issue #90 mode B).
- tapOn:
    id: "chat-message-input"
- inputText: "Message with reasoning effort set to high"
- hideKeyboard
- takeScreenshot: variant-S6_message_typed
- tapOn:
    id: "chat-send-button"

- extendedWaitUntil:
    visible:
      id: "chat-bubble-user"
    timeout: 10000
- assertVisible:
    id: "chat-bubble-user"
- assertVisible:
    text: ".*Message with reasoning effort set to high.*"
- takeScreenshot: variant-S7_message_sent
