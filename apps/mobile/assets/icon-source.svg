<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- RUSH CODE brand gradient: CLI 5-stop scale, horizontal (90deg) -->
    <linearGradient id="rushcodeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB02E" />
      <stop offset="25%" stop-color="#FF4A2D" />
      <stop offset="50%" stop-color="#E93A6B" />
      <stop offset="75%" stop-color="#8B3DFF" />
      <stop offset="100%" stop-color="#2E9BFF" />
    </linearGradient>

    <!-- Мягкая свечение-тень для глубины на темном/светлом фоне -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E93A6B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Иконка Rush Code в стиле Outline -->
  <g filter="url(#glow)">
    <!-- Внешний геокуб (Контейнер Rush Code) -->
    <path
      d="M 256,64
         L 432,160
         V 352
         L 256,448
         L 80,352
         V 160
         Z"
      fill="none"
      stroke="url(#rushcodeGradient)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />


    <!-- Символ Промпта '>' (AI Agent / Dev Environment) -->
    <path
      d="M 160,168 L 224,208 L 160,248"
      fill="none"
      stroke="url(#rushcodeGradient)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
