      description: >-
        File change row of a revert snapshot (upstream `FileDiff.Info` — provenance
        contracts/opencode-stand-2.2.0.json: field is `file`; the pinned sdk 1.18.33 still names it `path`,
        upstream renamed it to `file` by 2.2.0).
      properties:
