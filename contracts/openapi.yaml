        exist on the live 2.2.0 spec and may be absent until the server sets them.
      properties:
        created:
          type: number
        updated:
          type: number
        idle:
          type: number
        viewed:
          type: number
        archived:
          type: number
    OpencodePermissionEffect:
      type: string
      enum: [allow, deny, ask]
      description: Permission rule effect (upstream `Permission.Effect`).
    OpencodePermissionRule:
      type: object
