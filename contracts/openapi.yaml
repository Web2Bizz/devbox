      operationId: listSessionsDomain
      tags: [sessions]
      parameters:
        - name: projectId
          in: query
          required: false
          description: Owning project uuid — the C4 gate; missing answers 400 PROJECT_REQUIRED (fail-closed, never a global listing).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: domain sessions (always an array; empty when the project has none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionInfo'
        '400':
          description: missing projectId (code PROJECT_REQUIRED, the C4 gate) or the session runner rejected the request (code EXTERNAL_BAD_REQUEST) — non-retryable, no Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: unknown project for this caller (code not_found, no existence leak — the C4 gate) — non-retryable, no Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: session runner unreachable (code EXTERNAL_UNAVAILABLE, Retry-After) or it refused our credentials (code EXTERNAL_UNAUTHORIZED, no Retry-After)
          headers:
            Retry-After:
              description: seconds to wait before retrying
              schema:
                type: string
                example: '30'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Create a project session (domain shape; title/parentID forwarded honestly)
      operationId: createSessionDomain
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          description: created domain session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '400':
          description: missing projectId (code PROJECT_REQUIRED, the C4 gate), invalid body (code bad_request — our zod) or the session runner rejected the payload (code EXTERNAL_BAD_REQUEST) — non-retryable, no Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: unknown project for this caller (code not_found, no existence leak — the C4 gate) — non-retryable, no Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: session runner unreachable (code EXTERNAL_UNAVAILABLE, Retry-After) or it refused our credentials (code EXTERNAL_UNAUTHORIZED, no Retry-After)
          headers:
            Retry-After:
              description: seconds to wait before retrying
              schema:
                type: string
                example: '30'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
