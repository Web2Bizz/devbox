  /api/sessions/providers:
    get:
      summary: List the project session-runner providers (required artifact subset; credential-bearing members are never projected)
      operationId: listSessionProvidersDomain
      tags: [sessions]
      parameters:
        - name: projectId
          in: query
          required: false
          description: Owning project uuid — the C4 gate; missing answers 400 PROJECT_REQUIRED.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: domain provider rows (always an array; empty when the runner reports none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionRunnerProvider'
        '400':
          description: >-
            missing projectId (code PROJECT_REQUIRED, the C4 gate) or the session runner rejected the
            request (code EXTERNAL_BAD_REQUEST, honest upstream 400 passthrough) — non-retryable, no Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: >-
            unknown project for this caller (code not_found, no existence leak — the C4 gate) or the
            location is unknown upstream (code EXTERNAL_NOT_FOUND, honest upstream 404 passthrough) —
            non-retryable, no Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: >-
            session runner unreachable (code EXTERNAL_UNAVAILABLE, Retry-After), it refused our
            credentials (code EXTERNAL_UNAUTHORIZED, no Retry-After) or a provider row drifted off the
            artifact REQUIRED set (code EXTERNAL_UNAVAILABLE — contract drift fails loud, never a
            silently skipped row)
