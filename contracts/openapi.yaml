                $ref: '#/components/schemas/ApiError'
        '404':
          description: unknown project for this caller (code not_found, no existence leak — the C4 gate) — non-retryable, no Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: session runner unreachable (code EXTERNAL_UNAVAILABLE, Retry-After) or it refused our credentials (code EXTERNAL_UNAUTHORIZED, no Retry-After)
          headers:
            Retry-After:
