components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived HS256 access token from POST /api/v1/auth/login (or register).
  schemas:
    Health:
      type: object
      required: [status, db, opencode, registry, npmRegistry]
      properties:
        status:
          type: string
          example: ok
        db:
          type: string
          enum: [up, down, skipped]
        opencode:
          type: string
          enum: [up, down]
          description: opencode server reachability (up = any HTTP response, down = timeout/network)
        registry:
          type: string
          enum: [up, down, skipped]
          description: docker registry reachability (up = any HTTP response, down = timeout/network, skipped = DOCKER_REGISTRY_URL unset)
        npmRegistry:
          type: string
          enum: [up, down, skipped]
          description: npm registry (Verdaccio) reachability (up = 2xx with valid credentials, down = timeout/network/auth-failure 401-403, skipped = NPM_REGISTRY_URL unset)
    RegistryCatalog:
      type: object
      required: [repositories]
      description: GET /api/v1/registry/catalog payload (live Docker Registry /v2/_catalog only)
      properties:
        repositories:
          type: array
          items:
            type: string
          example: ['library/nginx', 'team/app']
    NpmRegistryStatus:
      type: object
      required: [status, url, scope]
      description: GET /api/v1/registry/npm/status payload (live Verdaccio /-/ping with valid credentials only; 401-403 answer 503 neutral; secrets never in payload)
      properties:
        status:
          type: string
          enum: [up]
          example: up
        url:
          type: string
          example: https://npm.registry.web2bizz.team
        scope:
          type: string
          example: '@web2bizz'
    Session:
      type: object
      required: [id, title, createdAt]
      properties:
        id:
          type: string
          example: ses_abc123
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        model:
          type: string
    ChatMessage:
      type: object
      required: [id, sessionId, role, content, createdAt]
      properties:
        id:
          type: string
        sessionId:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    SendChatRequest:
      type: object
      required: [message]
      properties:
        sessionId:
          type: string
        message:
          type: string
    SendChatResponse:
      type: object
      required: [sessionId, message]
      properties:
        sessionId:
          type: string
        message:
          $ref: '#/components/schemas/ChatMessage'
    MessagesResponse:
      type: object
      required: [sessionId, messages]
      properties:
        sessionId:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
    OpencodePrompt:
      type: object
      required: [parts]
      description: >-
        POST /api/opencode/session/{id}/message body (upstream session.prompt
        passthrough, see contracts/opencode-upstream.json). Optional
        messageID/model/agent/noReply/system/tools/variant/format + required
        non-empty parts (text/file/agent/subtask). Text-only callers keep
        working: { parts: [{ type: 'text', text: 'hi' }] }.
      properties:
        messageID:
          type: string
        model:
          type: object
          required: [providerID, modelID]
          properties:
            providerID:
              type: string
            modelID:
              type: string
        agent:
          type: string
        noReply:
          type: boolean
        system:
          type: string
        tools:
          type: object
          additionalProperties:
            type: boolean
        variant:
          type: string
        format:
          description: upstream OutputFormat passthrough (live only)
        parts:
          type: array
          minItems: 1
          items:
            type: object
            required: [type]
            properties:
              type:
                type: string
                enum: [text, file, agent, subtask]
              text:
                type: string
                minLength: 1
              mime:
                type: string
              url:
                type: string
              filename:
                type: string
              name:
                type: string
              prompt:
                type: string
              description:
                type: string
              agent:
                type: string
    OpencodeCommand:
      type: object
      required: [command, arguments]
      description: POST /api/opencode/session/{id}/command body (upstream session.command passthrough).
      properties:
        messageID:
          type: string
        agent:
          type: string
        model:
          type: string
        arguments:
          type: string
          minLength: 1
        command:
          type: string
          minLength: 1
        variant:
          type: string
    OpencodeShell:
      type: object
      required: [agent, command]
      description: POST /api/opencode/session/{id}/shell body (upstream session.shell passthrough).
      properties:
        messageID:
          type: string
        agent:
          type: string
          minLength: 1
        model:
          type: object
          required: [providerID, modelID]
          properties:
            providerID:
              type: string
            modelID:
              type: string
        command:
          type: string
          minLength: 1
    OpencodeFork:
      type: object
      description: POST /api/opencode/session/{id}/fork body (upstream session.fork passthrough).
      properties:
        messageID:
          type: string
    OpencodeSessionUpdate:
      type: object
      description: PATCH /api/opencode/session/{id} body (upstream session.update passthrough).
      properties:
        title:
          type: string
    OpencodeHealth:
      type: object
      required: [healthy, version]
      description: GET /api/opencode/global/health payload (upstream global.health passthrough).
      properties:
        healthy:
          type: boolean
          example: true
        version:
          type: string
          example: 1.18.33
    ApiError:
      type: object
      required: [code, message, correlationId]
      description: >-
        Frozen envelope — only new `code` VALUES are added, never new fields.
        Legacy lowercase codes (bad_request, unauthorized, forbidden,
        not_found, payload_too_large, request_failed, internal_error) plus
        typed upstream codes: EXTERNAL_TIMEOUT (504, per-attempt
        REQUEST_TIMEOUT_MS budget exceeded), EXTERNAL_UNAVAILABLE (503,
        network/unknown upstream failure), EXTERNAL_RATE_LIMITED (429),
        EXTERNAL_UPSTREAM_5XX (502 or the upstream 5xx), GITHUB_AUTH
        (401/403 from the GitHub App surface), auth codes:
        invalid_credentials (401, generic — no user enumeration),
        email_taken (409), provider_not_configured (501 stub seam).
        Retry policy: idempotent GET upstreams retry 429/5xx/timeout
        (EXTERNAL_RETRY_MAX_ATTEMPTS=3, BASE_DELAY_MS=200, MAX_DELAY_MS=2000);
        POST/PUT/PATCH/DELETE run once unless explicitly opted in.
      properties:
        code:
          type: string
          example: bad_request
        message:
          type: string
        correlationId:
          type: string
    AuthUser:
      type: object
      required: [id, firstName, lastName, email, provider, createdAt]
      description: Public account shape (never carries passwordHash).
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
          example: Ada
        lastName:
          type: string
          example: Lovelace
        email:
          type: string
          example: ada@devbox.local
        provider:
          type: string
          enum: [local, sso-oauth, github-app]
          example: local
        createdAt:
          type: string
          format: date-time
    AuthTokens:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: bearer
        expiresIn:
          type: integer
          example: 900
    AuthSession:
      allOf:
        - $ref: '#/components/schemas/AuthTokens'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/AuthUser'
    OpencodeKeyBody:
      type: object
      required: [apiKey]
      description: Your own OpenCode API key (stored AES-256-GCM encrypted, never returned or logged).
      properties:
        apiKey:
          type: string
          minLength: 20
          maxLength: 1024
    OpencodeKeyResult:
      type: object
      required: [ok, updatedAt]
      properties:
        ok:
          type: boolean
          example: true
        updatedAt:
          type: string
          format: date-time
    OpencodeKeyDeleteResult:
      type: object
      required: [ok]
      description: Idempotent delete acknowledgement (no timestamp).
      properties:
        ok:
          type: boolean
          example: true
    OpencodeKeyStatus:
      type: object
      required: [configured]
      description: Key existence only (never the key itself).
      properties:
        configured:
          type: boolean
          example: true
        updatedAt:
          type: string
          format: date-time
    OpencodeUsage:
      type: object
      required: [balance, usage, updatedAt]
      description: Live upstream balance+usage (updatedAt = upstream response time, no cache).
      properties:
        balance:
          type: number
          example: 42.5
        usage:
          type: number
          example: 7.25
        updatedAt:
          type: string
          format: date-time
    AuthRegister:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          example: Ada
        lastName:
          type: string
          example: Lovelace
        email:
          type: string
          example: ada@devbox.local
        password:
          type: string
          minLength: 8
    AuthLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: ada@devbox.local
        password:
          type: string
          minLength: 8
    AuthRefresh:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    AuthUpdateMe:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
    Project:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        githubOwner:
          type: string
          nullable: true
        githubRepo:
          type: string
          nullable: true
        githubBranch:
          type: string
          nullable: true
        githubUrl:
          type: string
          nullable: true
        ownerId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        corrupted:
          type: boolean
          description: "Computed flag (no DB column): true when the project row exists but the on-disk git repo is missing or invalid"
        corruptedReason:
          type: string
          nullable: true
          description: "Machine reason when corrupted (missing-dir, no-git, rev-parse-failed, fsck-failed, timeout, storage-unconfigured, …). storage-unconfigured = REPOS_ROOT empty (required for project writes; fallback chain is readonly-registry only)"
    CreateProject:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        githubOwner:
          type: string
        githubRepo:
          type: string
        githubBranch:
          type: string
        githubUrl:
          type: string
        ownerId:
          type: string
    ProjectChat:
      type: object
      required: [id, projectId, title, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateChat:
      type: object
      required: [title]
      properties:
        title:
          type: string
    ProjectSession:
      type: object
      required: [id, projectId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        chatId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [open, closed]
        metadata:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateSession:
      type: object
      properties:
        chatId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [open, closed]
        metadata:
          type: object
          nullable: true
    GithubLink:
      type: object
      required: [owner, repo]
      properties:
        owner:
          type: string
        repo:
          type: string
        branch:
          type: string
    GithubLinkStatus:
      type: object
      required: [linked]
      properties:
        linked:
          type: boolean
        owner:
          type: string
          nullable: true
        repo:
          type: string
          nullable: true
        branch:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
    GithubRepo:
      type: object
      required: [id, owner, name, fullName, private, defaultBranch, url]
      properties:
        id:
          type: integer
          example: 1296269
        owner:
          type: string
          example: acme
        name:
          type: string
          example: devbox-backend
        fullName:
          type: string
          example: acme/devbox-backend
        private:
          type: boolean
        defaultBranch:
          type: string
          example: main
        url:
          type: string
          example: https://github.com/acme/devbox-backend
    GithubInstallUrl:
      type: object
      required: [url]
      properties:
        url:
          type: string
          example: https://github.com/apps/devbox/installations/new
    GithubCallbackResult:
      type: object
      required: [ok, installationId]
      properties:
        ok:
          type: boolean
          example: true
        installationId:
          type: integer
          example: 789012
    GithubWebhookAck:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true
    FileNode:
      type: object
      required: [path, type]
      properties:
        path:
          type: string
        type:
          type: string
          enum: [file, dir]
        children:
          type: array
          items:
            $ref: '#/components/schemas/FileNode'
    Repo:
      type: object
      required: [userSpace, name, path, updatedAt]
      description: >-
        Valid git repo from the readonly registry
        (REPOS_ROOT/<user-space>/workspace/<repo>; path is relative to
        REPOS_ROOT, updatedAt is the repo directory mtime).
      properties:
        userSpace:
          type: string
          example: alice
        name:
          type: string
          example: demo
        path:
          type: string
          example: alice/workspace/demo
        updatedAt:
          type: string
          format: date-time
    ProjectScope:
      type: string
      enum: [user, org]
      description: >-
        Project home scope on disk (REPOS_ROOT): user →
        users/<uuid>/projects/<id>/content, org →
        orgs/<uuid>/projects/<id>/content (no `workspace` segment). Linking a
        project to an org is metadata-only (no disk move — see
        docs/manual-migration-orgs-layout.md); access follows the scope rule:
        linked projects admit any member of a linked org, user-space projects
        admit only the owner.
      example: user
    Organization:
      type: object
      required: [id, name, isPrivate, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: acme
        description:
          type: string
          nullable: true
        ownerId:
          type: string
          format: uuid
          nullable: true
          description: creator (SET NULL — the org outlives its creator)
        isPrivate:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateOrganization:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: acme
        description:
          type: string
        isPrivate:
          type: boolean
          default: true
    UpdateOrganization:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        isPrivate:
          type: boolean
    OrgRole:
      type: string
      enum: [maintainer, user]
      description: exactly one maintainer per org (partial unique index), unlimited users
      example: user
    OrganizationMember:
      type: object
      required: [orgId, userId, role, createdAt]
      properties:
        orgId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/OrgRole'
        createdAt:
          type: string
          format: date-time
    AddMember:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/OrgRole'
          default: user
    UpdateMemberRole:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/OrgRole'
    OrganizationInvite:
      type: object
      required: [token, orgId, role, expiresAt]
      description: single-use bearer token (returned ONCE, never logged; TTL ORG_INVITE_TTL_SEC, default 24h)
      properties:
        token:
          type: string
        orgId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/OrgRole'
        expiresAt:
          type: string
          format: date-time
    CreateInvite:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/OrgRole'
          default: user
    AcceptInvite:
      type: object
      required: [token]
      properties:
        token:
          type: string
# Proxy mapping (backend node:http → opencode server):
#   GET  /api/v1/session       → GET  {OPENCODE_SERVER_URL}/session
#   GET  /api/v1/messages?s=…  → GET  {OPENCODE_SERVER_URL}/messages?sessionId=…
#   POST /api/v1/chat          → POST {OPENCODE_SERVER_URL}/chat
# Sdk mirror (backend NestJS OpencodeController → opencode server via
# @opencode-ai/sdk 1.18.33 pinned, VERSION_NEUTRAL under /api — no version
# segment; upstream snapshot: contracts/opencode-upstream.json, GET /doc):
#   GET    /api/opencode/session                 → sdk session.list()
#   POST   /api/opencode/session                 → sdk session.create()
#   GET    /api/opencode/session/status          → sdk session.status()
#   GET    /api/opencode/session/{id}            → sdk session.get()
#   DELETE /api/opencode/session/{id}            → sdk session.delete()
#   PATCH  /api/opencode/session/{id}            → sdk session.update()
#   POST   /api/opencode/session/{id}/fork       → sdk session.fork()
#   GET    /api/opencode/session/{id}/message    → sdk session.messages() (+limit/before, x-next-cursor/Link passthrough)
#   POST   /api/opencode/session/{id}/message    → sdk session.prompt() (full body)
#   GET    /api/opencode/session/{id}/message/{messageID} → sdk session.message()
#   POST   /api/opencode/session/{id}/prompt_async → sdk session.promptAsync() (204)
#   POST   /api/opencode/session/{id}/command    → sdk session.command()
#   POST   /api/opencode/session/{id}/shell      → sdk session.shell()
#   POST   /api/opencode/session/{id}/abort      → sdk session.abort()
#   GET    /api/opencode/config/providers        → sdk config.providers()
#   GET    /api/opencode/global/event (SSE)      → sdk global.event() re-stream
#   GET    /api/opencode/global/health           → raw GET {upstream}/global/health (no sdk binding)
#   GET    /api/opencode/event (SSE)             → sdk event.subscribe() re-stream
# Removed: unversioned /api/session, /api/messages, /api/chat → 404 not_found.
# Reserved: /api/v2/* → 404 { code: 'not_found', … } (no v2 bindings yet).
# Timeout: REQUEST_TIMEOUT_MS (default 10000) per attempt via AbortController/fetch signal.
# Retry: idempotent GET upstreams retry 429/5xx/timeout with exponential
#   backoff (EXTERNAL_RETRY_MAX_ATTEMPTS=3, BASE_DELAY_MS=200, MAX_DELAY_MS=2000,
#   equal jitter); POST /api/v1/chat runs once (non-idempotent guard) unless
#   the caller opts into allowNonIdempotentRetry.
# Errors: upstream non-2xx / timeout / network → 503 EXTERNAL_UNAVAILABLE
#         («сервис временно недоступен, повторите позже») with Retry-After;
#         invalid body/route → 4xx ApiError envelope with x-correlation-id;
#         typed upstream failures (GitHub surface) → EXTERNAL_* envelope.
