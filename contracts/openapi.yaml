openapi: 3.0.3
info:
  title: Rush Code opencode proxy API
  version: 0.1.0
  description: >-
    Thin proxy layer between frontend clients and the live opencode server.
    Backend (node:http) forwards /api/v1/* to OPENCODE_SERVER_URL with
    REQUEST_TIMEOUT_MS timeout; unreachable upstream answers 503
    EXTERNAL_UNAVAILABLE («сервис временно недоступен, повторите позже»)
    with a Retry-After header — no mock fallbacks, a 200 always means live
    upstream data. An upstream that refuses the credentials we sent (401/403)
    answers 503 EXTERNAL_UNAUTHORIZED instead — a distinct code and NO
    Retry-After (a retry with the same credentials cannot help). Request-level
    upstream 4xx are never masked as outages: 400/422 answer
    EXTERNAL_BAD_REQUEST (400/422) and 404 answers EXTERNAL_NOT_FOUND (404),
    both non-retryable and without Retry-After.
    Error envelope is always { code, message, correlationId }.
    New sdk mirror (VERSION_NEUTRAL, no version segment):
    /api/opencode/session, /api/opencode/session/status,
    /api/opencode/session/{id} (GET/DELETE/PATCH),
    /api/opencode/session/{id}/message (GET with limit/before + POST),
    /api/opencode/session/{id}/message/{messageID},
    /api/opencode/session/{id}/prompt_async (204),
    /api/opencode/session/{id}/command, /api/opencode/session/{id}/shell,
    /api/opencode/session/{id}/fork, /api/opencode/session/{id}/abort,
    /api/opencode/config/providers, /api/opencode/global/event (SSE),
    /api/opencode/global/health, /api/opencode/event (SSE) — same paths as
    the upstream opencode OpenAPI so the frontend uses the SAME
    @opencode-ai/sdk against
    <NEXT_PUBLIC_API_URL>/api/opencode. Unreachable upstream answers 503
    EXTERNAL_UNAVAILABLE with Retry-After (no mock 200s); an upstream that
    refused our credentials (401/403) answers 503 EXTERNAL_UNAUTHORIZED
    without Retry-After; request-level upstream 4xx answer honestly
    (EXTERNAL_BAD_REQUEST 400/422, EXTERNAL_NOT_FOUND 404, no Retry-After).

    Versioning policy:
    - canonical: /api/v1/* (frontend clients must use these paths);
    - removed: unversioned /api/* aliases were deleted → 404 { code: 'not_found', … };
    - reserved: /api/v2/* binds nothing yet → 404 { code: 'not_found', … };
    - /health is an unversioned liveness probe (no /api/v1/health alias).
    Swagger: /swagger + /swagger/v1 serve the v1 document
    (/swagger.json, /openapi.yaml); /swagger/v2 is an empty reserved stub.
servers:
  - url: http://localhost:3000
    description: backend local
  - url: http://localhost:8080
    description: frontend via compose (proxied browser → frontend)
paths:
  /health:
    get:
      summary: Liveness + postgres/opencode/registry reachability
      operationId: getHealth
      responses:
        '200':
          description: ok (even if db/opencode/registry down — flags carry the state)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/registry/catalog:
    get:
      summary: List registry repositories (proxy → Docker Registry /v2/_catalog, 503 when unreachable)
      operationId: listRegistryCatalogV1
      responses:
        '200':
          description: live catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCatalog'
        '503':
          description: registry unreachable (code EXTERNAL_UNAVAILABLE, Retry-After)
          headers:
            Retry-After:
              description: seconds to wait before retrying
              schema:
                type: string
                example: '30'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/registry/npm/status:
    get:
      summary: npm registry status (probe → Verdaccio /-/ping, 503 when unreachable or auth refused)
      operationId: getNpmRegistryStatusV1
      responses:
        '200':
          description: live npm status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NpmRegistryStatus'
        '503':
          description: npm registry unreachable or auth refused (code EXTERNAL_UNAVAILABLE, neutral message, Retry-After)
          headers:
            Retry-After:
              description: seconds to wait before retrying
              schema:
                type: string
                example: '30'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/projects:
    post:
      summary: Create project
      operationId: createProjectV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/projects/{id}:
    get:
      summary: Get project by id
      operationId: getProjectV1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    patch:
      summary: Update project
      operationId: updateProjectV1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    delete:
      summary: Soft-delete project (status=deleted, stops containers, restore via API)
      operationId: deleteProjectV1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: deleted
  /api/v1/projects/{id}/chats:
    get:
      summary: List project chats
      operationId: listProjectChatsV1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: chats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectChat'
    post:
      summary: Create project chat
      operationId: createProjectChatV1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChat'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectChat'
  /api/v1/projects/{id}/sessions:
    get:
      summary: List project sessions
      operationId: listProjectSessionsV1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSession'
    post:
      summary: Create project session (binds projectId + optional chatId)
      operationId: createProjectSessionV1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSession'
  /api/v1/projects/{id}/github-link:
    get:
      summary: GitHub link status
      operationId: githubLinkStatusV1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubLinkStatus'
    post:
      summary: Link GitHub repository (REMOVED — 410, set githubOwner/githubRepo via PATCH)
      operationId: linkGithubV1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GithubLink'
      responses:
        '200':
          description: linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    delete:
      summary: Unlink GitHub repository (REMOVED — 410)
      operationId: unlinkGithubV1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: unlinked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /api/v1/projects/github/install-url:
    get:
      summary: Get the GitHub App install URL for the current user (multi-tenant)
      operationId: getGithubInstallUrlV1
      responses:
        '200':
          description: App install entrypoint (https://github.com/apps/<slug>/installations/new)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubInstallUrl'
        '503':
          description: GitHub App slug / install state secret is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/projects/github/callback:
    get:
      summary: Bind a fresh GitHub App installation to the current user
      operationId: githubInstallCallbackV1
      parameters:
        - name: installation_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: setup_action
          in: query
          required: false
          schema:
            type: string
            default: install
        - name: state
          in: query
          required: true
          description: Signed install state issued by GET /api/v1/projects/github/install-url
          schema:
            type: string
      responses:
        '200':
          description: installation bound to user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubCallbackResult'
        '400':
          description: bad query (installation_id / setup_action / state) or an invalid/expired state (code GITHUB_STATE_INVALID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: state belongs to another user (GITHUB_STATE_FORBIDDEN) or the installation is owned by another user / predates the state (GITHUB_INSTALLATION_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: GitHub App / install state secret is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/projects/github/webhook:
    post:
      summary: GitHub App webhook (installation lifecycle, X-Hub-Signature-256 verified)
      operationId: githubWebhookV1
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: sha256=<hex hmac-sha256(rawBody, GITHUB_WEBHOOK_SECRET)>
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          required: false
          description: GitHub event name (only `installation` mutates state)
          schema:
            type: string
      responses:
        '200':
          description: event acked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubWebhookAck'
        '401':
          description: invalid webhook signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: webhook secret is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/projects/github/repos:
    get:
      summary: List GitHub App installation repositories for the current user (per-install token, never stored)
      operationId: listGithubReposV1
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: installation repositories (normalized)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GithubRepo'
        '400':
          description: bad query (page/per_page out of range)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: GitHub App is not configured / auth failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No installation for this user (code GITHUB_NOT_INSTALLED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: GitHub rate limit (code EXTERNAL_RATE_LIMITED, retry later)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: GitHub upstream unavailable (code EXTERNAL_UNAVAILABLE / EXTERNAL_UPSTREAM_5XX)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '504':
          description: GitHub upstream timeout (code EXTERNAL_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/register:
    post:
      summary: Register a local account (email+password)
      operationId: registerV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegister'
      responses:
        '201':
          description: registered (user + access/refresh pair)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: bad request (validation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: email already registered (code email_taken)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/login:
    post:
      summary: Log in with email+password
      operationId: loginV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogin'
      responses:
        '200':
          description: logged in (user + access/refresh pair)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: bad request (validation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: invalid credentials (generic code invalid_credentials, no enumeration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/refresh:
    post:
      summary: Rotate the refresh token (single-use jti, reuse revokes)
      operationId: refreshV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefresh'
      responses:
        '200':
          description: rotated pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: invalid or reused refresh token (code invalid_credentials)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/logout:
    post:
      summary: Log out (revoke the refresh token, idempotent)
      operationId: logoutV1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefresh'
      responses:
        '200':
          description: logged out
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: true
  /api/v1/auth/me:
    get:
      summary: Current user profile (Bearer access token)
      operationId: getMeV1
      security:
        - bearerAuth: []
      responses:
        '200':
          description: profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          description: missing/invalid bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      summary: Update current user profile (firstName/lastName)
      operationId: updateMeV1
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthUpdateMe'
      responses:
        '200':
          description: updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          description: missing/invalid bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/key:
    get:
      summary: Whether you have an OpenCode API key stored (existence only, never the key)
      operationId: getOpencodeKeyStatusV1
      security:
        - bearerAuth: []
      responses:
        '200':
          description: key status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpencodeKeyStatus'
        '401':
          description: missing/invalid bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: postgres unreachable (code EXTERNAL_UNAVAILABLE, Retry-After)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      summary: Store your own OpenCode API key (AES-256-GCM at rest, never returned or logged)
      operationId: putOpencodeKeyV1
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpencodeKeyBody'
      responses:
        '200':
          description: stored (ok + updatedAt, no secret echo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpencodeKeyResult'
        '400':
          description: bad request (validation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: missing/invalid bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: key encryption is not configured (code opencode_keys_unconfigured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: postgres unreachable (code EXTERNAL_UNAVAILABLE, Retry-After)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      summary: Delete your stored OpenCode API key (idempotent)
      operationId: deleteOpencodeKeyV1
      security:
        - bearerAuth: []
      responses:
        '200':
          description: deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpencodeKeyDeleteResult'
        '401':
          description: missing/invalid bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: postgres unreachable (code EXTERNAL_UNAVAILABLE, Retry-After)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/usage:
    get:
      summary: Live OpenCode balance+usage for your stored key (per-user Bearer, no cache)
      operationId: getOpencodeUsageV1
      security:
        - bearerAuth: []
      responses:
        '200':
          description: live balance+usage (updatedAt = upstream response time)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpencodeUsage'
        '401':
          description: missing/invalid bearer, or the stored key was rejected upstream (code opencode_key_invalid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: no key stored for this user (code opencode_key_missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: upstream rate limit (code EXTERNAL_RATE_LIMITED, retry later)
          headers:
            Retry-After:
              description: seconds to wait before retrying
              schema:
                type: string
                example: '30'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '502':
          description: upstream server error passthrough (code EXTERNAL_UPSTREAM_5XX, Retry-After)
          headers:
            Retry-After:
              description: seconds to wait before retrying
              schema:
                type: string
                example: '30'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: upstream unavailable or shape mismatch (code EXTERNAL_UNAVAILABLE, Retry-After)
          headers:
            Retry-After:
              description: seconds to wait before retrying
              schema:
                type: string
                example: '30'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '504':
          description: upstream timeout (code EXTERNAL_TIMEOUT, Retry-After)
          headers:
            Retry-After:
              description: seconds to wait before retrying
              schema:
                type: string
                example: '30'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/users/{id}:
    get:
      summary: Get own user profile (403 for anyone else — no enumeration)
      operationId: getUserV1
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: own profile (private — X-Robots-Tag noindex)
          headers:
            X-Robots-Tag:
              description: noindex (private response, never indexed)
              schema:
                type: string
                example: noindex
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          description: missing/invalid bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: not your profile (fires before any DB lookup)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: own profile missing (deleted after token issue)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/organizations:
    post:
      summary: Create organization (caller becomes maintainer)
      operationId: createOrganizationV1
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganization'
      responses:
        '201':
          description: created (private — X-Robots-Tag noindex)
          headers:
            X-Robots-Tag:
              description: noindex (private response, never indexed)
              schema:
                type: string
                example: noindex
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: bad request (validation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: missing/invalid bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: owner user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: storage unconfigured (REPOS_ROOT empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: postgres unreachable (code EXTERNAL_UNAVAILABLE, Retry-After)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      summary: List organizations of the caller (membership-scoped, never global)
      operationId: listOrganizationsV1
      security:
        - bearerAuth: []
      responses:
        '200':
          description: caller orgs (private — X-Robots-Tag noindex)
          headers:
            X-Robots-Tag:
              description: noindex (private response, never indexed)
              schema:
                type: string
                example: noindex
          content:
            application/json:
