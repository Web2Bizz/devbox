          enum: [true]
    OpencodeSessionRevert:
      type: object
      required: [messageID]
      additionalProperties: false
      description: >-
        Revert state attached to a session (upstream `Session.Revert`; 2.2.0 dropped
        the sdk 1.18.33 `diff` field — provenance contracts/opencode-stand-2.2.0.json).
      properties:
        messageID:
          type: string
        partID:
