    OpencodeSession:
      type: object
      required: [id, projectID, cost, tokens, time, location]
      additionalProperties: false
      description: >-
        Opencode session as the /api/opencode/* mirror answers: GET list item,
        POST create, GET /{id} — VERBATIM upstream `Session.Info` passthrough
        (2.2.0 live spec; the mirror only unwraps the {data}/{data,cursor}
        envelopes and never re-maps fields). Everything outside the required
        set appears only once the server sets it — a freshly created session
        carries no `title` (provenance: contracts/opencode-stand-2.2.0.json, live probe).
      properties:
        id:
          type: string
        parentID:
          type: string
        projectID:
          type: string
        agent:
          type: string
        model:
          $ref: '#/components/schemas/OpencodeSessionModelRef'
        cost:
          type: number
        tokens:
          $ref: '#/components/schemas/OpencodeSessionTokens'
        outcome:
          type: string
          enum: [succeeded, failed, interrupted]
        time:
          $ref: '#/components/schemas/OpencodeSessionTime'
        title:
          type: string
        subpath:
          type: string
        metadata:
          type: object
          description: free-form upstream metadata bag (Session.Metadata)
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/OpencodePermissionRule'
        fork:
          $ref: '#/components/schemas/OpencodeSessionFork'
        revert:
          $ref: '#/components/schemas/OpencodeSessionRevert'
        location:
          $ref: '#/components/schemas/OpencodeLocationRef'
    OpencodeSessionStatusAction:
      type: object
      required: [reason, provider, title, message, label]
      description: Retry action detail carried by a retry status (upstream session.status payload).
      properties:
        reason:
          type: string
        provider:
          type: string
        title:
          type: string
        message:
          type: string
        label:
          type: string
        link:
          type: string
    OpencodeSessionStatus:
      description: >-
        Live status of one session. Shape carried from the pinned
        @opencode-ai/sdk v2 `SessionStatus` union — the 2.2.0 openapi.json
        publishes no session-status schema, and the legacy GET /session/status
        path our status route proxies is not served by the current stand
        (SPA catch-all). Consumers must treat unknown type values as neither
        busy nor idle.
      oneOf:
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [idle]
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [busy]
        - type: object
          required: [type, attempt, message, next]
          properties:
            type:
              type: string
              enum: [retry]
            attempt:
              type: integer
              minimum: 1
            message:
              type: string
            next:
              type: number
              description: epoch millis of the next retry attempt
            action:
              $ref: '#/components/schemas/OpencodeSessionStatusAction'
    OpencodeSessionStatusMap:
      type: object
      description: >-
        GET /api/opencode/session/status payload — upstream session.status map
        (sessionID → status) passthrough.
      additionalProperties:
        $ref: '#/components/schemas/OpencodeSessionStatus'
    OpencodeEventDurable:
      type: object
      required: [aggregateID, seq, version]
      description: Durable-seq marker some upstream event variants carry.
      properties:
        aggregateID:
          type: string
        seq:
          type: number
        version:
          type: number
    OpencodeEvent:
      type: object
      required: [id, type, data]
      description: >-
        Flat v2 bus event re-streamed by GET /api/opencode/event. The pinned
        sdk `event.subscribe()` parses the upstream SSE envelope
        {id?, event, data:JSON-string} away, and our relay writes the PARSED
        event object as the downstream data: frame — so the downstream frame
        is the flat event object itself (verified by live /api/event probe:
        data: {"id":"evt_…","type":"server.connected","data":{}}; sdk
        V2EventSubscribeResponses.200 = V2Event). `type` discriminates a large
        upstream-owned variant union; per-variant data payloads pass through
        as unknown records (mirroring every variant = card 4).
      properties:
        id:
          type: string
        type:
          type: string
        data:
          type: object
          description: per-type upstream payload (variant-owned, untouched)
        metadata:
          type: object
        durable:
          $ref: '#/components/schemas/OpencodeEventDurable'
        location:
          $ref: '#/components/schemas/OpencodeLocationRef'
    OpencodeBusEvent:
      type: object
      required: [id, type, properties]
      description: >-
        Flat LEGACY bus event ({id, type, properties}) — shape of the pinned
        sdk `Event` union members, carried inside GlobalEvent.payload below.
      properties:
        id:
          type: string
        type:
          type: string
        properties:
          type: object
          description: per-type upstream payload (variant-owned, untouched)
    OpencodeGlobalEvent:
      type: object
      required: [directory, payload]
      description: >-
        Legacy global frame re-streamed by GET /api/opencode/global/event:
        routing envelope ({directory, project?, workspace?}) wrapping a flat
        bus event in `payload` — shape from the pinned sdk `GlobalEvent`.
        The current 2.2.0 stand does NOT serve /global/event (SPA catch-all);
        replacing this surface is card 4 scope.
      properties:
        directory:
          type: string
        project:
          type: string
        workspace:
          type: string
        payload:
          $ref: '#/components/schemas/OpencodeBusEvent'
    OpencodeHealth:
      type: object
      required: [healthy, version]
      description: GET /api/opencode/global/health payload — synthesized by the backend from the 2.x v2 liveness endpoint GET /api/info (there is no upstream `healthy` field; healthy=true iff /api/info answered 2xx JSON with a string version). Shape is unchanged from the legacy global.health passthrough.
      properties:
        healthy:
          type: boolean
          example: true
        version:
          type: string
          example: 2.2.0
    ProjectStatus:
      type: string
      enum: [active, deleted]
    EffectiveConfigEntry:
      type: object
      required: [key, value, origin, overridden]
      properties:
        key:
          type: string
        value:
          type: string
          description: masked when secret-backed
        origin:
          type: string
          enum: [project, organization]
        overridden:
          type: boolean
    ApiError:
      type: object
      required: [code, message, correlationId]
      description: >-
        Frozen envelope — only new `code` VALUES are added, never new fields.
        Legacy lowercase codes (bad_request, unauthorized, forbidden,
        not_found, payload_too_large, request_failed, internal_error) plus
        typed upstream codes: EXTERNAL_TIMEOUT (504, per-attempt
        REQUEST_TIMEOUT_MS budget exceeded), EXTERNAL_UNAVAILABLE (503,
        network/unknown upstream failure), EXTERNAL_RATE_LIMITED (429),
        EXTERNAL_UPSTREAM_5XX (502 or the upstream 5xx), EXTERNAL_UNAUTHORIZED
        (503, the upstream refused the credentials we sent — upstream
        401/403, never a caller session problem: the answer is 503 and NOT
        401 on purpose, and it carries NO Retry-After because a retry with
        the same credentials cannot help), EXTERNAL_BAD_REQUEST (the upstream
        rejected THIS request shape — upstream 400/422 answered as 400/422,
        non-retryable, no Retry-After: repeating the request cannot help),
        EXTERNAL_NOT_FOUND (the upstream knows the resource is absent —
        upstream 404 answered as 404, non-retryable, no Retry-After),
        GITHUB_AUTH
        (401/403 from the GitHub App surface), auth codes:
        invalid_credentials (401, generic — no user enumeration),
        email_taken (409), provider_not_configured (501 stub seam).
        Retry policy: idempotent GET upstreams retry 429/5xx/timeout
        (EXTERNAL_RETRY_MAX_ATTEMPTS=3, BASE_DELAY_MS=200, MAX_DELAY_MS=2000);
        POST/PUT/PATCH/DELETE run once unless explicitly opted in.
      properties:
        code:
          type: string
          example: bad_request
        message:
          type: string
        correlationId:
          type: string
