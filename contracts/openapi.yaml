              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived HS256 access token from POST /api/v1/auth/login (or register).
  schemas:
    Health:
      type: object
      required: [status, db, opencode, registry, npmRegistry]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
        db:
          type: string
          enum: [up, down, skipped]
        opencode:
          type: string
          enum: [up, down]
          description: opencode server reachability (up = any HTTP response, down = timeout/network)
        registry:
          type: string
          enum: [up, down, skipped]
          description: docker registry reachability (up = any HTTP response, down = timeout/network, skipped = DOCKER_REGISTRY_URL unset)
        npmRegistry:
          type: string
          enum: [up, down, skipped]
          description: npm registry (Verdaccio) reachability (up = 2xx with valid credentials, down = timeout/network/auth-failure 401-403, skipped = NPM_REGISTRY_URL unset)
    RegistryCatalog:
      type: object
      required: [repositories]
      description: GET /api/v1/registry/catalog payload (live Docker Registry /v2/_catalog only)
      properties:
        repositories:
          type: array
          items:
            type: string
          example: ['library/nginx', 'team/app']
    NpmRegistryStatus:
      type: object
      required: [status, url, scope]
      description: GET /api/v1/registry/npm/status payload (live Verdaccio /-/ping with valid credentials only; 401-403 answer 503 neutral; secrets never in payload)
      properties:
        status:
          type: string
          enum: [up]
          example: up
        url:
          type: string
          example: https://npm.registry.web2bizz.team
        scope:
          type: string
          example: '@web2bizz'
    Session:
      type: object
      required: [id, title, createdAt]
      properties:
        id:
          type: string
          example: ses_abc123
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        model:
          type: string
    ChatMessage:
      type: object
      required: [id, sessionId, role, content, createdAt]
      properties:
        id:
          type: string
        sessionId:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    SendChatRequest:
      type: object
      required: [message]
      properties:
        sessionId:
          type: string
        message:
          type: string
    SendChatResponse:
      type: object
      required: [sessionId, message]
      properties:
        sessionId:
          type: string
        message:
          $ref: '#/components/schemas/ChatMessage'
    MessagesResponse:
      type: object
      required: [sessionId, messages]
      properties:
        sessionId:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
    OpencodePrompt:
      type: object
      required: [parts]
      description: >-
        POST /api/opencode/session/{id}/message body (upstream session.prompt
        passthrough, see contracts/opencode-upstream.json). Optional
        messageID/model/agent/noReply/system/tools/variant/format + required
        non-empty parts (text/file/agent/subtask). Text-only callers keep
        working: { parts: [{ type: 'text', text: 'hi' }] }.
      properties:
        messageID:
          type: string
        model:
          type: object
          required: [providerID, modelID]
          properties:
            providerID:
              type: string
            modelID:
              type: string
        agent:
          type: string
        noReply:
          type: boolean
        system:
          type: string
        tools:
          type: object
          additionalProperties:
            type: boolean
        variant:
          type: string
        format:
          description: upstream OutputFormat passthrough (live only)
        parts:
          type: array
          minItems: 1
          items:
            type: object
            required: [type]
            properties:
              type:
                type: string
                enum: [text, file, agent, subtask]
              text:
                type: string
                minLength: 1
              mime:
                type: string
              url:
                type: string
              filename:
                type: string
              name:
                type: string
              prompt:
                type: string
              description:
                type: string
              agent:
                type: string
    OpencodeCommand:
      type: object
      required: [command, arguments]
      description: POST /api/opencode/session/{id}/command body (upstream session.command passthrough).
      properties:
        messageID:
          type: string
        agent:
          type: string
        model:
          type: string
        arguments:
          type: string
          minLength: 1
        command:
          type: string
          minLength: 1
        variant:
          type: string
    OpencodeShell:
      type: object
      required: [agent, command]
      description: POST /api/opencode/session/{id}/shell body (upstream session.shell passthrough).
      properties:
        messageID:
          type: string
        agent:
          type: string
          minLength: 1
        model:
          type: object
          required: [providerID, modelID]
          properties:
            providerID:
              type: string
            modelID:
              type: string
        command:
          type: string
          minLength: 1
    OpencodeFork:
      type: object
      description: POST /api/opencode/session/{id}/fork body (upstream session.fork passthrough).
      properties:
        messageID:
          type: string
    OpencodeSessionUpdate:
      type: object
      description: PATCH /api/opencode/session/{id} body (upstream session.update passthrough).
      properties:
        title:
          type: string
    SessionInfoModel:
      type: object
      required: [id, providerID]
      description: Model attached to a session (translated from the runtime model ref; null on the session row until set).
      properties:
        id:
          type: string
        providerID:
          type: string
        variant:
          type: string
    SessionInfo:
      type: object
      required: [id, title, createdAt, directory, projectId, model, status]
      description: >-
        Domain session row (GET/POST /api/sessions) — OUR shape, stable while
        the runtime behind it changes: title/model are explicitly nullable
        (a fresh session carries neither), createdAt is ISO-8601 (the runtime
        keeps epoch millis; the backend converts), directory is the jailed
        project path the session works in, projectId is OUR uuid (bound by
        the access gate, not the runtime's internal project hash).
      properties:
        id:
          type: string
        title:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        directory:
          type: string
        projectId:
          type: string
          format: uuid
        model:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SessionInfoModel'
        status:
          $ref: '#/components/schemas/SessionRunStatus'
    CreateSessionRequest:
      type: object
      required: [projectId]
      description: >-
        POST /api/sessions body — projectId is required (sessions are
        project-scoped); title/parentID are honestly forwarded to the runtime
        create (the deprecated mirror could not forward them). model is the
        SessionInfoModel ref (upstream Model.Ref shape); without it the
        runner picks its server default.
      properties:
        projectId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        parentID:
          type: string
          minLength: 1
          maxLength: 200
        model:
          allOf:
            - $ref: '#/components/schemas/SessionInfoModel'
    SessionRunStatus:
      description: >-
        Runtime status snapshot of one session: busy while the server reports
        an active drain for it, idle otherwise. The transient retry state
        (shape shared via the same union) is observable on the event stream
        only — a REST snapshot never fakes it.
      allOf:
        - $ref: '#/components/schemas/OpencodeSessionStatus'
    SessionRunStatusMap:
      type: object
      description: GET /api/sessions/status payload — sessionId → derived runtime status.
      additionalProperties:
        $ref: '#/components/schemas/SessionRunStatus'
    SessionMessage:
      type: object
      required: [id, type, createdAt, text]
      description: >-
        Normalized domain message row (GET/POST /api/sessions/{id}/messages) — the chat-visible
        projection of the runtime message union (provenance
        contracts/opencode-stand-2.2.0.json Session.Message.*): id/type/time.created are required on
        every variant; text is the variant's own text or the assistant content[] text parts joined,
        null for non-text variants (never faked). Variant nesting the UI does not consume is
        intentionally not exposed.
      properties:
        id:
          type: string
        type:
          type: string
          description: variant discriminator (user, assistant, system, synthetic, shell, skill, idle, agent-switched, model-switched, location-switched, compaction …) — kept open, the variant set is upstream-owned
        createdAt:
          type: string
          format: date-time
        text:
          type: string
          nullable: true
    SendMessageRequest:
      type: object
      required: [projectId, text]
      description: >-
        POST /api/sessions/{id}/messages body — text mirrors the session
        runner prompt's only required payload field; files/agents/skills/delivery stay unexposed
        until a consumer exists (nothing invented). model is the
        SessionInfoModel ref (same as on create); without it the runner
        keeps the session model.
      properties:
        projectId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
        model:
          allOf:
            - $ref: '#/components/schemas/SessionInfoModel'
    SessionStreamFrame:
      type: object
      required: [id, type, data]
      description: >-
        SSE frame of GET /api/sessions/events — envelope of the flat runtime event frame
        (provenance contracts/opencode-stand-2.2.0.json eventFrames). `session` is the
        backend-hoisted variant sessionID (data.sessionID, the only nesting the provenance
        artifact carries on session-scoped variants) so
        consumers never touch the upstream name at the top level; `data` stays the variant-owned
        payload passed through untouched (envelope-only stance of card 3 — the large variant union
        is never mirrored here).
      properties:
        id:
          type: string
        type:
          type: string
        data:
          type: object
          description: per-type upstream payload, passed through
        session:
          type: string
          description: hoisted session id when the variant carries one
    InterruptSessionRequest:
      type: object
      required: [projectId]
      description: >-
        POST /api/sessions/{id}/interrupt body — projectId is the gate uuid. The runner's own
        resume knob (provenance contracts/opencode-stand-2.2.0.json interrupt parameters) has
        no UI consumer and is deliberately not exposed — nothing invented.
      properties:
        projectId:
          type: string
          format: uuid
    SessionInterruptResult:
      type: object
      required: [interrupted]
      description: >-
        POST /api/sessions/{id}/interrupt answer — domain form of the artifact
        SessionInterruptResponse ({interrupted} verbatim, contracts/opencode-stand-2.2.0.json
        paths['/api/session/{sessionID}/interrupt']). false is the idle no-op: an honest
        answer, never an error.
      properties:
        interrupted:
          type: boolean
    SessionRunnerProvider:
      type: object
      required: [id, name, activation, package]
      description: >-
        GET /api/sessions/providers row — the REQUIRED subset of the artifact Provider.Info
        (contracts/opencode-stand-2.2.0.json components.schemas['Provider.Info']:
        id/name/activation/package, activation enum verbatim). Optional and sensitive
        Provider.Info members (settings/headers/body — headers can carry auth material) are
        never projected to the browser and are not consumed by the UI.
      properties:
        id:
          type: string
        name:
          type: string
        activation:
          type: string
          enum: [auto, enabled, disabled]
        package:
          type: string
    OpencodeLocationRef:
      type: object
      required: [directory]
      additionalProperties: false
      description: >-
        Session location — jailed directory of the project. Verbatim upstream (contracts/opencode-stand-2.2.0.json:
        Location.PublicRef = {directory} only — no workspaceID in the published 2.x shape).
        `Location.PublicRef` passthrough (2.2.0 live spec; required field of
        Session.Info.location). Rush Code adds no fields here.
      properties:
        directory:
          type: string
    OpencodeSessionModelRef:
      type: object
      required: [id, providerID]
      additionalProperties: false
      description: >-
        Model reference attached to a session (upstream `Model.Ref` passthrough).
        Distinct from OpencodeModelRef (prompt-body provider/model pair).
      properties:
        id:
