        metadata:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateSession:
      type: object
      properties:
        chatId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [open, closed]
        metadata:
          type: object
          nullable: true
    GithubLink:
      type: object
      required: [owner, repo]
      properties:
        owner:
          type: string
        repo:
          type: string
        branch:
          type: string
    GithubLinkStatus:
      type: object
      required: [linked]
      properties:
        linked:
          type: boolean
        owner:
          type: string
          nullable: true
        repo:
          type: string
          nullable: true
        branch:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
    GithubRepo:
      type: object
      required: [id, owner, name, fullName, private, defaultBranch, url]
      properties:
        id:
          type: integer
          example: 1296269
        owner:
          type: string
          example: acme
        name:
          type: string
          example: rush-code-backend
        fullName:
          type: string
          example: acme/rush-code-backend
        private:
          type: boolean
        defaultBranch:
          type: string
          example: main
        url:
          type: string
          example: https://github.com/acme/rush-code-backend
    GithubInstallUrl:
      type: object
      required: [url]
      properties:
        url:
          type: string
          example: https://github.com/apps/rush-code/installations/new
    GithubCallbackResult:
      type: object
      required: [ok, installationId]
      properties:
        ok:
          type: boolean
          example: true
        installationId:
          type: integer
          example: 789012
    GithubWebhookAck:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true
    FileNode:
      type: object
      required: [path, type]
      properties:
        path:
          type: string
        type:
          type: string
          enum: [file, dir]
        children:
          type: array
          items:
            $ref: '#/components/schemas/FileNode'
    Repo:
      type: object
      required: [userSpace, name, path, updatedAt]
      description: >-
        Valid git repo from the readonly registry
        (REPOS_ROOT/<user-space>/workspace/<repo>; path is relative to
        REPOS_ROOT, updatedAt is the repo directory mtime).
      properties:
        userSpace:
          type: string
          example: alice
        name:
          type: string
          example: demo
        path:
          type: string
          example: alice/workspace/demo
        updatedAt:
          type: string
          format: date-time
    ProjectScope:
      type: string
      enum: [user, org]
      description: >-
        Project home scope on disk (REPOS_ROOT): user →
        users/<uuid>/projects/<id>/content, org →
        orgs/<uuid>/projects/<id>/content (no `workspace` segment). Linking a
        project to an org is metadata-only (no disk move — see
        docs/manual-migration-orgs-layout.md); access follows the scope rule:
        linked projects admit any member of a linked org, user-space projects
        admit only the owner.
      example: user
    Organization:
      type: object
      required: [id, name, isPrivate, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: acme
        description:
          type: string
          nullable: true
        ownerId:
          type: string
          format: uuid
          nullable: true
          description: creator (SET NULL — the org outlives its creator)
        isPrivate:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateOrganization:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: acme
        description:
          type: string
        isPrivate:
          type: boolean
          default: true
    UpdateOrganization:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        isPrivate:
          type: boolean
    OrgRole:
      type: string
      enum: [maintainer, user]
      description: exactly one maintainer per org (partial unique index), unlimited users
      example: user
    OrganizationMember:
      type: object
      required: [orgId, userId, role, createdAt]
      properties:
        orgId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/OrgRole'
        createdAt:
          type: string
          format: date-time
    AddMember:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/OrgRole'
          default: user
    UpdateMemberRole:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/OrgRole'
    OrganizationInvite:
      type: object
      required: [token, orgId, role, createdAt]
      description: persistent single-use uuidv7 invite (returned ONCE, never logged; no TTL — links never expire)
      properties:
        token:
          type: string
          format: uuid
          description: uuidv7 invite token (link material, single-use)
        orgId:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
          description: bound email (lowercased) or null for open link-invites
        role:
          $ref: '#/components/schemas/OrgRole'
        createdAt:
          type: string
          format: date-time
    CreateInvite:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/OrgRole'
          default: user
        email:
          type: string
          format: email
          description: bound email for email-invites; absent = open link-invite
    AcceptInvite:
      type: object
      required: [token]
      properties:
        token:
          type: string
          format: uuid
          description: uuidv7 invite token
# Proxy mapping (backend node:http → opencode server):
#   GET  /api/v1/session       → GET  {OPENCODE_SERVER_URL}/session
#   GET  /api/v1/messages?s=…  → GET  {OPENCODE_SERVER_URL}/messages?sessionId=…
#   POST /api/v1/chat          → POST {OPENCODE_SERVER_URL}/chat
# Sdk mirror (backend NestJS OpencodeController → opencode server via
# @opencode-ai/sdk 1.18.33 pinned, VERSION_NEUTRAL under /api — no version
# segment; upstream snapshot: contracts/opencode-upstream.json, GET /doc):
#   GET    /api/opencode/session                 → sdk session.list()
#   POST   /api/opencode/session                 → sdk session.create()
#   GET    /api/opencode/session/status          → sdk session.status()
#   GET    /api/opencode/session/{id}            → sdk session.get()
#   DELETE /api/opencode/session/{id}            → sdk session.delete()
#   PATCH  /api/opencode/session/{id}            → sdk session.update()
#   POST   /api/opencode/session/{id}/fork       → sdk session.fork()
#   GET    /api/opencode/session/{id}/message    → sdk session.messages() (+limit/before, x-next-cursor/Link passthrough)
#   POST   /api/opencode/session/{id}/message    → sdk session.prompt() (full body)
#   GET    /api/opencode/session/{id}/message/{messageID} → sdk session.message()
#   POST   /api/opencode/session/{id}/prompt_async → sdk session.promptAsync() (204)
#   POST   /api/opencode/session/{id}/command    → sdk session.command()
#   POST   /api/opencode/session/{id}/shell      → sdk session.shell()
#   POST   /api/opencode/session/{id}/abort      → sdk session.abort()
#   GET    /api/opencode/config/providers        → sdk config.providers()
#   GET    /api/opencode/global/event (SSE)      → sdk global.event() re-stream
#   GET    /api/opencode/global/health           → raw GET {upstream}/api/info → synthesized {healthy, version} (no sdk binding; the 2.x spec has no /global/health)
#   GET    /api/opencode/event (SSE)             → sdk event.subscribe() re-stream
# Removed: unversioned /api/session, /api/messages, /api/chat → 404 not_found.
# Reserved: /api/v2/* → 404 { code: 'not_found', … } (no v2 bindings yet).
# Timeout: REQUEST_TIMEOUT_MS (default 10000) per attempt via AbortController/fetch signal.
# Retry: idempotent GET upstreams retry 429/5xx/timeout with exponential
#   backoff (EXTERNAL_RETRY_MAX_ATTEMPTS=3, BASE_DELAY_MS=200, MAX_DELAY_MS=2000,
#   equal jitter); POST /api/v1/chat runs once (non-idempotent guard) unless
#   the caller opts into allowNonIdempotentRetry.
# Errors: upstream non-2xx / timeout / network → 503 EXTERNAL_UNAVAILABLE
#         («сервис временно недоступен, повторите позже») with Retry-After;
#         invalid body/route → 4xx ApiError envelope with x-correlation-id;
#         typed upstream failures (GitHub surface) → EXTERNAL_* envelope.
