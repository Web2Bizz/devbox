  /api/v1/repos:
    get:
      summary: List valid git repos across all user-spaces (readonly registry, corrupted skipped)
      operationId: listReposV1
      description: >-
        Readonly index over REPOS_ROOT/<user-space>/workspace/<repo> (user drops
        repos there by hand; the backend never clones or writes). Only
        directories with a valid .git are returned (git rev-parse + fsck, 5s
        timeout, no shell); no-git/corrupted entries are skipped with a warn
        log and never fail the whole listing. Supports limit (1-100, default
        50), offset (default 0), q (case-insensitive name substring).
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: valid repos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Repo'
        '400':
          description: bad query (limit/offset/q out of range)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
