services:
  backend:
    ports:
      - "127.0.0.1:${APP_BACKEND_PORT:-${PORT:-3100}}:3100"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-debug}

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: build
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${APP_BACKEND_SOCKET:-http://localhost:3100}}
    command: ["bun", "run", "dev:next"]
    working_dir: /app/apps/frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${APP_BACKEND_SOCKET:-http://localhost:3100}}
      NEXT_PUBLIC_PORT: ${NEXT_PUBLIC_PORT:-3001}
    ports:
      - "127.0.0.1:${NEXT_PUBLIC_PORT:-3001}:3001"
    volumes:
      - ./apps/frontend/app:/app/apps/frontend/app
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./apps/frontend/public:/app/apps/frontend/public
      - ./apps/frontend/next.config.mjs:/app/apps/frontend/next.config.mjs
      - frontend-dev-next:/app/apps/frontend/.next
    depends_on:
      - backend

volumes:
  frontend-dev-next:
