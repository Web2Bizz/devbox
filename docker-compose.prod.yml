services:
  backend:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M

  frontend:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M

  # Heavier than the 1G/1.0 standard: the image bakes Playwright Chromium +
  # pm2 + global CLIs (standalone stack allows 2.5g). 2G keeps browser runs
  # clear of OOM while trimming the dev allowance for shared prod hosts.
  opencode:
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
