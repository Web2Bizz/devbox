# SINGLE compose file for the whole stack (backend + frontend + opencode).
# There is no docker-compose.prod.yml / docker-compose.override.yml and no
# `env_file:` — all configuration arrives via EXTERNAL environment
# (shell / Dokploy). `.env.example` documents the full variable list;
# `.env.${NODE_ENV}` files are NOT read by compose at runtime (only CI reads `.env.develop`/`.env.production` as build-args), do not create them for compose.
#
# Prod services run REGISTRY images, not local builds: backend/frontend/
# opencode resolve via TAG (`.../<service>:${TAG:-latest}`, default `:latest`
# = what CI publishes on every build alongside `:dev` and `:<sha>`; prod
# override pins a tag per environment, e.g. `TAG=<sha>`).
# There are NO local builds and NO profile-gated services in this file: dev runs the SAME
# services from registry images (the frontend image already carries the
# CI-baked NEXT_PUBLIC_API_URL from `.env.develop` as a build-arg).
#
# Postgres is EXTERNAL: no postgres service here, DATABASE_URL fail-fasts
# when unset (same `:?` pattern as OPENCODE_SERVER_PASSWORD).
#
# Resource limits (ex docker-compose.prod.yml) are baked in directly — they
# are identical in every environment: backend/frontend 1G/1.0, opencode 2G/2.0.
#
# Dev/prod differences (ex docker-compose.override.yml) are env-driven:
#   BACKEND_PUBLISH  `[ip:]hostport` целиком, default prod `3100` (все
#                    интерфейсы); dev ставит `127.0.0.1:3100`. Контейнерный
#                    порт фиксирован `:3100` (совпадает с APP_BACKEND_PORT).
#   FRONTEND_PUBLISH `[ip:]hostport` целиком, default prod `8080`; dev loopback
#                    ставит `127.0.0.1:8080`. Контейнерный порт фиксирован `:3000`.
#   LOG_LEVEL        default `info`; the environment sets `debug`, no file does.
# Usage:
#   prod: docker compose up -d
#         (pulls registry images; DATABASE_URL and OPENCODE_SERVER_PASSWORD
#         are REQUIRED externals — compose fail-fasts without them)
#   dev:  BACKEND_PUBLISH=127.0.0.1:3100 FRONTEND_PUBLISH=127.0.0.1:8080 \
#         docker compose up -d
#         (SAME services from registry images; loopback publish values come
#         from the shell. Local hot-reload without compose is `bun run dev`,
#         see README)
services:
  backend:
    image: docker.registry.web2bizz.team/web2bizz/devbox/backend:${TAG:-latest}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
    environment:
      APP_BACKEND_PORT: ${APP_BACKEND_PORT:-3100}
      APP_BACKEND_HOST: ${APP_BACKEND_HOST:-0.0.0.0}
      APP_BACKEND_PROTOCOL: ${APP_BACKEND_PROTOCOL:-http}
      APP_BACKEND_SOCKET: ${APP_BACKEND_SOCKET:-http://localhost:3100}
      # DATABASE_URL must point at the EXTERNAL postgres (no postgres service
      # in this stack). Fail-fast when unset — same `:?` pattern as
      # OPENCODE_SERVER_PASSWORD below.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is not set — point it at the external postgres}
      OPENCODE_URL: ${OPENCODE_URL:-http://opencode:4096}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:8080}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-10000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DOCKER_REGISTRY_URL: ${DOCKER_REGISTRY_URL:-}
      DOCKER_REGISTRY_USER: ${DOCKER_REGISTRY_USER:-}
      DOCKER_REGISTRY_PASSWORD: ${DOCKER_REGISTRY_PASSWORD:-}
      DOCKER_REGISTRY_TOKEN: ${DOCKER_REGISTRY_TOKEN:-}
      DOCKER_REGISTRY_TIMEOUT_MS: ${DOCKER_REGISTRY_TIMEOUT_MS:-}
      DOCKER_REGISTRY_RETRY_MAX_ATTEMPTS: ${DOCKER_REGISTRY_RETRY_MAX_ATTEMPTS:-}
      DOCKER_REGISTRY_RETRY_BASE_DELAY_MS: ${DOCKER_REGISTRY_RETRY_BASE_DELAY_MS:-}
      DOCKER_REGISTRY_RETRY_MAX_DELAY_MS: ${DOCKER_REGISTRY_RETRY_MAX_DELAY_MS:-}
      NPM_REGISTRY_URL: ${NPM_REGISTRY_URL:-}
      NPM_REGISTRY_TOKEN: ${NPM_REGISTRY_TOKEN:-}
      NPM_TOKEN: ${NPM_TOKEN:-}
      NPM_REGISTRY_USER: ${NPM_REGISTRY_USER:-}
      NPM_REGISTRY_PASSWORD: ${NPM_REGISTRY_PASSWORD:-}
      NPM_REGISTRY_SCOPE: ${NPM_REGISTRY_SCOPE:-}
      NPM_REGISTRY_TIMEOUT_MS: ${NPM_REGISTRY_TIMEOUT_MS:-}
      NPM_REGISTRY_RETRY_MAX_ATTEMPTS: ${NPM_REGISTRY_RETRY_MAX_ATTEMPTS:-}
      NPM_REGISTRY_RETRY_BASE_DELAY_MS: ${NPM_REGISTRY_RETRY_BASE_DELAY_MS:-}
      NPM_REGISTRY_RETRY_MAX_DELAY_MS: ${NPM_REGISTRY_RETRY_MAX_DELAY_MS:-}
    ports:
      - "${BACKEND_PUBLISH:-3100}:3100"
    networks:
      - front
      - back
    healthcheck:
      # oven/bun images carry the bun runtime (no wget/curl guaranteed),
      # so probe via bun. Port follows the app's listen port.
      # NOTE: `$${p}` — the double $ escapes compose interpolation, so the
      # container receives a literal `${p}` that bun expands at runtime. A bare
      # `${p}` is interpolated by compose itself, renders as `http://localhost:/health`
      # and makes the probe fail forever.
      test: ["CMD-SHELL", "bun -e 'const p=process.env.APP_BACKEND_PORT||process.env.PORT||3100;const r=await fetch(`http://localhost:$${p}/health`);if(!r.ok)process.exit(1)'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    # NEXT_PUBLIC_API_URL is baked into the registry image at CI build time
    # (docker.yml passes it as build-arg); a different browser-facing API URL
    # needs a rebuilt image, runtime env cannot change the bundle.
    image: docker.registry.web2bizz.team/web2bizz/devbox/frontend:${TAG:-latest}
    restart: unless-stopped
    environment:
      HOSTNAME: "0.0.0.0"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
    ports:
      - "${FRONTEND_PUBLISH:-8080}:3000"
    networks:
      - front
    depends_on:
      - backend
    healthcheck:
      # oven/bun runner has no wget — probe the Next standalone via bun fetch.
      test: ["CMD-SHELL", "bun -e 'for(const h of[\"127.0.0.1\",\"localhost\"]){try{const r=await fetch(\"http://\"+h+\":3000/\");if(r.ok)process.exit(0)}catch(e){}}process.exit(1)'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # No depends_on from backend: the backend tolerates an unreachable opencode
  # (mock fallback, never throws at boot), so startup order is not enforced.
  opencode:
    image: docker.registry.web2bizz.team/web2bizz/devbox/opencode:${TAG:-latest}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD is not set}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_BASE_PATH: ${OPENCODE_BASE_PATH:-/}
    volumes:
      - opencode-projects:/workspace
      - opencode-ssh-keys:/root/.ssh
      - opencode-gh-config:/root/.config/gh
      - opencode-pnpm-store:/pnpm/store
      - opencode-pm2-home:/root/.pm2
      - opencode-data:/root/.local/share/opencode
      - opencode-secrets:/root/.secrets
      - opencode-playwright-browsers:/playwright-browsers
    expose:
      - 4096
    networks:
      - back
    healthcheck:
      # curl ships in the image; any HTTP status (even 401/404 behind auth)
      # means `opencode serve` is up — only a refused connection fails.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:4096 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  opencode-projects:
  opencode-ssh-keys:
  opencode-gh-config:
  opencode-pnpm-store:
  opencode-pm2-home:
  opencode-data:
  opencode-secrets:
  opencode-playwright-browsers:

networks:
  front:
  back:
