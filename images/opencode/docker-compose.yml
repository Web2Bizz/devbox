services:
  opencode:
    build: .
    container_name: opencode-dev
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    environment:
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD is not set}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - OPENCODE_BASE_PATH=${OPENCODE_BASE_PATH:-/}
    volumes:
      - projects:/workspace
      - ssh-keys:/root/.ssh
      - gh-config:/root/.config/gh
      - pnpm-store:/pnpm/store
      - pm2-home:/root/.pm2
      - opencode-data:/root/.local/share/opencode
      - secrets:/root/.secrets
      - playwright-browsers:/playwright-browsers
    deploy:
      resources:
        limits:
          cpus: 2.5
          memory: 2.5g
    expose:
      - 4096
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  ssh-keys:
  projects:
  gh-config:
  pnpm-store:
  pm2-home:
  opencode-data:
  secrets:
  playwright-browsers:
